<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YouGo魚你同行</title>
    <link rel="icon" type="image/png" href="./images/頭像-01.png">

<meta name="description" content="出遊排行程不再手忙腳亂！用「YouGo魚你同行」輕鬆整理每日景點、必吃美食、住宿資訊與地圖導航，還能加密鎖定、即時同步，隨時打開就能看。">
<meta property="og:title" content="YouGo魚你同行">
<meta property="og:description" content="簡易旅程規劃，出遊排行程不再手忙腳亂！用「YouGo魚你同行」輕鬆整理每日景點、必吃美食、住宿資訊與地圖導航，還能加密鎖定、即時同步，隨時打開就能看。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fish550212.github.io/travel/code_artifact.html">
    <meta property="og:locale" content="zh_TW">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="./css/itinerary.css">
    <link rel="stylesheet" href="./css/controls.css">
</head>
<body class="bg-slate-50 text-slate-600 min-h-screen flex flex-col">

    <!-- 頂部導航列：改為單一清新水藍色（無漸層） -->
    <header class="page-header bg-[#0a507b] text-slate-50 shadow-sm sticky  top-0 z-50">
        <div class="page-header-inner max-w-7xl mx-auto px-3 sm:px-4 flex flex-row justify-between items-center gap-2 sm:gap-3">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0 flex-1">
                <a id="back-to-trip-list" href="./index.html" aria-label="返回旅行列表" title="返回旅行列表" class="ui-control ui-small ui-square inline-grid shrink-0 place-items-center text-sky-100 hover:text-white"><i class="fa-solid fa-chevron-left text-sm" aria-hidden="true"></i></a>
                
                <div class="min-w-0">
                    <h1 id="trip-header-title" class="font-bold tracking-tight break-words">您的旅遊計畫</h1>
                    <p id="trip-header-dates" class="mt-0.5 truncate text-xs leading-tight text-sky-100"></p>
                </div>
            </div>
            <div class="flex shrink-0 justify-end items-center gap-2 max-w-[65%] sm:max-w-none">
                <!-- 雲端同步狀態指示器 -->
                <div id="cloud-sync-status" role="status" class="ui-icon-16 text-sky-100 text-xs flex min-h-8 min-w-8 items-center justify-center gap-1.5">
                    <i class="fa-solid fa-cloud text-sky-200" aria-hidden="true"></i>
                    <span id="sync-text" class="sr-only">同步中</span>
                </div>
                <span id="completed-counter" class="bg-black/20 text-sm px-3.5 py-1.5 rounded-full border border-white/10 hidden sm:flex items-center gap-1.5 text-sky-100">
                    <i class="fa-solid fa-circle-check text-sky-200"></i> 總景點數 <span id="total-count">12</span> 個
                </span>
                <button id="reset-schedules" disabled hidden class="ui-control ui-large bg-white/10 hover:bg-white/20 px-3.5 transition border border-white/20 flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> 重置行程
                </button>

                <button id="open-stay" type="button" aria-label="查看住宿資訊" aria-haspopup="dialog" aria-controls="trip-stay" title="住宿資訊" class="ui-icon-16 ui-control ui-small ui-square inline-grid shrink-0 place-items-center text-sky-100 hover:bg-white/10">
                    <i class="fa-solid fa-bed text-sm" aria-hidden="true"></i>
                </button> <button id="edit-trip-password" type="button" disabled aria-label="密碼設定" title="密碼設定" class="ui-icon-16 ui-control ui-small ui-square inline-grid shrink-0 place-items-center text-sky-100 hover:bg-white/10 disabled:opacity-50">
                    <i id="trip-password-icon" class="fa-solid fa-lock-open text-sm" aria-hidden="true"></i>
                </button>
                <button id="edit-trip-title" type="button" disabled aria-label="旅程編輯" title="旅程編輯" class="ui-icon-16 ui-control ui-small ui-square inline-grid shrink-0 place-items-center text-sky-100 hover:bg-white/10 disabled:opacity-50">
                    <i class="fa-solid fa-calendar-days text-sm" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區：採用左右排版 -->
    <main id="trip-workspace" data-view="itinerary" class="trip-workspace max-w-7xl mx-auto px-4 py-4 w-full grid grid-cols-1 gap-4 flex-1">

        <!-- 左側：三日行程規劃表 (5欄) -->
        <div id="trip-plan" class="trip-pane min-w-0 space-y-[10px]">
            <div class="flex min-w-0 shrink-0 flex-col gap-[10px]">
            
            <!-- 防呆小幫手區塊 -->
            <section id="trip-reminders" class="trip-section min-w-0 bg-white border border-slate-200 rounded-[8px] shadow-xs" aria-labelledby="reminder-title">
                <div class="flex items-center gap-2 mb-2">
                    <div class="title-icon text-rose-400" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <h2 id="reminder-title" class="font-bold text-slate-800 text-lg">重要提醒</h2>
                    <button id="edit-reminder" type="button" disabled aria-label="編輯重要提醒" title="編輯重要提醒" class="ui-control ui-large ui-square ui-icon-16 ml-auto inline-grid shrink-0 place-items-center text-slate-500 disabled:opacity-50">
                        <i class="fa-solid fa-gear" aria-hidden="true"></i>
                    </button>
                </div>
                <p id="reminder-line" class="text-sm text-slate-600"><span id="reminder-text" class="reminder-copy">載入中...</span> <button id="toggle-reminder" type="button" hidden aria-expanded="false" aria-controls="reminder-text" class="whitespace-nowrap rounded font-medium text-sky-700 underline">...更多</button></p>
            </section>

            </div>

            <div id="trip-itinerary" class="trip-section min-h-0 flex-1 bg-white rounded-[8px] border border-slate-200 flex flex-col">
                <div id="itinerary-toolbar" class="mb-[10px] flex items-center justify-between gap-3">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2 text-[18px]">
                        <span class="title-icon text-[#0284c7]" aria-hidden="true"><i class="fa-solid fa-calendar-days"></i></span> 行程表
                    </h3>
                    <button id="edit-itinerary" type="button" aria-pressed="false" aria-label="調整行程" title="調整行程" class="ui-control ui-large ui-square ui-icon-16 inline-grid shrink-0 place-items-center text-slate-500 disabled:opacity-50">
                        <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                    </button>
                </div>
                <div id="trip-date-marker" aria-hidden="true" class="h-px -mb-px shrink-0"></div>
                <div id="trip-date-row" class="mb-[10px] flex min-w-0 shrink-0 gap-1 rounded-xl bg-slate-100 p-1">
                    <div id="trip-day-tabs" role="group" aria-label="行程日期" class="flex min-w-0 flex-1 overflow-x-auto"></div>
                    <button id="add-trip-day" type="button" aria-label="新增一天行程" title="新增一天行程" disabled class="ui-control ui-large ui-square mx-1 grid shrink-0 place-items-center self-center bg-transparent leading-none text-slate-600 hover:text-sky-700 disabled:opacity-50"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
                </div>

                <!-- 行程站點清單 -->
                <div id="itinerary-list" class="trip-pane-scroll space-y-[10px] flex-grow">
                    <!-- 動態載入 -->
                </div>
            </div>
        </div>

        <!-- 右側：可用景點與美食資料庫 (7欄) -->
        <div id="trip-places" class="trip-pane relative min-w-0 space-y-[10px]">
            <div class="places-heading flex items-center justify-between gap-2">
                <h2 class="flex items-center gap-2 text-lg font-bold text-slate-800">
                    <span class="title-icon text-[#0284c7]" aria-hidden="true"><i class="fa-solid fa-compass"></i></span> 規劃景點
                </h2>
                <label class="inline-flex items-center gap-1 text-[14px] font-medium text-slate-600">旅遊日期
                    <select id="explore-day" class="ui-control ui-small border border-slate-200 bg-white px-2 text-slate-800">
                    </select>
                </label>
            </div>
            
            <div class="flex flex-col gap-2 bg-white p-3 rounded-[8px] border border-slate-200">
                <!-- 搜尋列 -->
                <div class="flex items-stretch gap-2">
                    <div class="relative min-w-0 flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm" aria-hidden="true"></i>
                        <input type="text" id="search-input" placeholder="搜尋景點、美食或地區..." class="ui-control ui-large w-full pl-10 pr-4 bg-slate-50 border border-slate-200">
                    </div>
                    <button id="add-place" type="button" disabled class="ui-control ui-large shrink-0 whitespace-nowrap bg-[#0284c7] px-3 font-semibold text-white hover:bg-[#0369a1] disabled:opacity-50"><i class="fa-solid fa-plus mr-1" aria-hidden="true"></i>新增</button>
                </div>

                <!-- 分類篩選 -->
                <div class="flex gap-1.5 shrink-0 w-full sm:w-auto">
                    <button id="filter-all" class="ui-control ui-small filter-btn bg-[#606d80] text-white px-3 font-medium transition shadow-xs">全部</button>
                    <button id="filter-attraction" class="ui-control ui-small filter-btn bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 font-medium transition">景點</button>
                    <button id="filter-restaurant" class="ui-control ui-small filter-btn bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 font-medium transition">美食</button>
                </div>
            </div>

            <p id="place-status" role="status" class="text-sm text-slate-600 empty:hidden"></p>
            <div id="add-feedback" hidden class="rounded-xl border border-sky-200 bg-sky-50 px-3 py-2 text-sm text-sky-900">
                <span id="add-feedback-text" role="status"></span>
                <button id="undo-add" type="button" class="ui-control ui-small ml-2 font-bold underline">復原</button>
            </div>
            <!-- 清單容器 -->
            <div id="items-container" class="trip-pane-scroll space-y-[10px]">
                <!-- 動態載入項目 -->
            </div>
            <span id="places-sticky-marker" class="pointer-events-none absolute left-0 top-0 h-px w-px !m-0" aria-hidden="true"></span>
        </div>

    </main>

    <nav class="mobile-nav" aria-label="行程區塊">
        <a id="nav-itinerary" href="#trip-itinerary" aria-current="true"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i><span>行程</span></a>
        <a id="nav-places" href="#trip-places"><i class="fa-solid fa-compass" aria-hidden="true"></i><span>景點</span></a>
        <button id="nav-stay" type="button" aria-haspopup="dialog" aria-controls="trip-stay"><i class="fa-solid fa-bed" aria-hidden="true"></i><span>住宿</span></button>
    </nav>

    <dialog id="trip-stay" aria-labelledby="stay-title" class="rounded-2xl p-0 w-[90vw] max-w-lg max-h-[90vh] backdrop:bg-slate-900/50">
        <div class="dialog-layout">
            <div class="flex items-center gap-2">
                <h2 id="stay-title" tabindex="-1" autofocus class="font-bold text-slate-800 text-lg flex items-center gap-2">
                    住宿資訊
                </h2>
                <button id="edit-stay" type="button" disabled aria-label="編輯住宿資訊" title="編輯住宿資訊" class="ui-control ui-large ui-square ui-icon-16 ml-auto inline-grid shrink-0 place-items-center text-slate-500 disabled:opacity-50">
                    <i class="fa-solid fa-gear" aria-hidden="true"></i>
                </button>
            </div>
            <div class="dialog-body">
            <p id="stay-name" hidden class="mb-1 text-sm font-semibold text-slate-800 break-words"></p>
            <div class="flex items-center gap-3">
                <p id="stay-address" class="min-w-0 flex-1 text-sm text-slate-600 leading-relaxed break-words">宜蘭縣羅東鎮純精路二段1號（套房9樓）</p>
                <a id="stay-map" href="https://www.google.com/maps/search/?api=1&amp;query=%E5%AE%9C%E8%98%AD%E7%B8%A3%E7%BE%85%E6%9D%B1%E9%8E%AE%E7%B4%94%E7%B2%BE%E8%B7%AF%E4%BA%8C%E6%AE%B51%E8%99%9F" target="_blank" rel="noopener noreferrer" aria-label="住宿地址地圖" class="ui-control ui-large inline-flex shrink-0 items-center gap-1.5 bg-orange-50 hover:bg-orange-100 text-orange-800 px-3 font-medium border border-orange-200 hover:border-orange-300"><i class="fa-solid fa-diamond-turn-right" aria-hidden="true"></i> 地圖</a>
            </div>
            <dl class="grid gap-[10px] my-[10px] text-sm">
                <div class="bg-sky-100 border border-sky-200 rounded-[8px] p-3"><dt class="text-sky-800 font-semibold text-xs mb-1">入住</dt><dd id="stay-check-in" class="font-bold text-sky-950 break-words">12/12（六）15:00</dd></div>
                <div class="bg-amber-100 border border-amber-200 rounded-[8px] p-3"><dt class="text-amber-800 font-semibold text-xs mb-1">退房</dt><dd id="stay-check-out" class="font-bold text-amber-950 break-words">12/14（一）11:00</dd></div>
            </dl>
            </div>
            <form method="dialog" class="dialog-actions"><button type="submit" class="ui-control ui-large bg-slate-100 px-4 font-semibold text-slate-700 hover:bg-slate-200">關閉</button></form>
        </div>
    </dialog>

    <dialog id="trip-details-dialog" aria-labelledby="trip-details-title" class="rounded-2xl p-0 w-[90vw] max-w-lg max-h-[90vh] backdrop:bg-slate-900/50">
        <form id="trip-details-form" class="dialog-layout">
            <h2 id="trip-details-title" tabindex="-1" autofocus class="text-lg font-bold text-slate-800"></h2>
            <div id="trip-details-body" class="dialog-body">
            <fieldset id="title-fields" class="space-y-3" hidden disabled>
                <label class="block text-sm">旅遊名稱<input name="tripTitle" type="text" required pattern=".*\S.*" maxlength="100" class="ui-control ui-large block w-full px-2 border mt-1"></label>
                <fieldset class="grid gap-2" aria-describedby="trip-date-error">

                    <div class="trip-date-field">
                        <label for="trip-departure-date" class="block text-sm">出發日</label>
                        <input id="trip-departure-date" name="departureDate" type="date" required min="0001-01-01" max="9999-12-31" class="ui-control ui-large block w-full min-w-0 px-2 border mt-1">
                    </div>
                    <div class="trip-date-field">
                        <label for="trip-return-date" class="block text-sm">回程日</label>
                        <input id="trip-return-date" name="returnDate" type="date" required min="0001-01-01" max="9999-12-31" class="ui-control ui-large block w-full min-w-0 px-2 border mt-1">
                    </div>
                </fieldset>
                <p id="trip-date-error" role="alert" class="text-sm text-red-700" hidden></p>
            </fieldset>
            <fieldset id="password-fields" class="space-y-2" hidden disabled>
                <div id="current-trip-password-field" hidden>
                    <label for="current-trip-password" class="text-sm">目前密碼</label>
                    <div class="mt-1 flex gap-2">
                        <input id="current-trip-password" type="password" autocomplete="off" readonly class="ui-control ui-small min-w-0 flex-1 px-2 border">
                        <button id="show-current-trip-password" type="button" aria-controls="current-trip-password" aria-pressed="false" class="ui-control ui-small shrink-0 bg-slate-100 px-3">顯示</button>
                    </div>
                </div>
                <label for="new-trip-password" class="block text-sm">設定或更換密碼</label>
                <div class="flex gap-2">
                    <input id="new-trip-password" name="newTripPassword" type="password" autocomplete="new-password" inputmode="numeric" minlength="6" maxlength="6" pattern="[0-9]{6}" aria-describedby="trip-password-hint" class="ui-control ui-small min-w-0 flex-1 px-2 border">
                    <button id="show-new-trip-password" type="button" aria-controls="new-trip-password" aria-pressed="false" class="ui-control ui-small shrink-0 bg-slate-100 px-3">顯示</button>
                </div>
                <p id="trip-password-hint" class="text-xs text-slate-600">留空會保留原設定。新密碼須為 6 位數字。</p>
                <label id="remove-trip-password-label" hidden class="text-sm"><input name="removeTripPassword" type="checkbox"> 關閉密碼</label>
                <p id="trip-password-error" role="alert" class="text-sm text-red-700" hidden></p>
            </fieldset>
            <fieldset id="reminder-fields">
                <label class="block text-sm">提醒內容<textarea name="reminder" rows="5" maxlength="2000" class="block w-full border rounded-xl p-2 mt-1"></textarea></label>
            </fieldset>
            <fieldset id="stay-fields" class="space-y-3">
                <label class="block text-sm">住宿名稱<input name="stayName" maxlength="100" class="ui-control ui-large block w-full px-2 border mt-1"></label>
                <label class="block text-sm">住宿地址<input name="address" required pattern=".*\S.*" maxlength="300" class="ui-control ui-large block w-full px-2 border mt-1"></label>
                <div class="trip-date-field">
                    <label for="stay-check-in-input" class="block text-sm">入住時間</label>
                    <input id="stay-check-in-input" name="checkIn" type="datetime-local" required class="ui-control ui-large block w-full min-w-0 px-2 border mt-1">
                </div>
                <div class="trip-date-field">
                    <label for="stay-check-out-input" class="block text-sm">退房時間</label>
                    <input id="stay-check-out-input" name="checkOut" type="datetime-local" required class="ui-control ui-large block w-full min-w-0 px-2 border mt-1">
                </div>
            </fieldset>
            </div>
            <div class="dialog-actions">
                <button id="cancel-trip-details" type="button" class="ui-control ui-large bg-slate-100 px-4">取消</button>
                <button type="submit" class="ui-control ui-large bg-[#0284c7] text-white px-4">儲存</button>
            </div>
        </form>
    </dialog>
    <dialog id="trip-unlock-dialog" aria-labelledby="trip-unlock-title" class="rounded-2xl p-0 w-[90vw] max-w-md backdrop:bg-slate-900/50">
        <form id="trip-unlock-form" class="dialog-layout">
            <h2 id="trip-unlock-title" tabindex="-1" autofocus class="text-lg font-bold text-slate-800">解鎖旅程</h2>
            <div class="dialog-body space-y-4">
                <label for="trip-unlock-password" class="block text-sm">輸入密碼</label>
                <div class="mt-1 flex gap-2">
                    <input id="trip-unlock-password" type="password" autocomplete="current-password" maxlength="72" required class="ui-control ui-small min-w-0 flex-1 px-2 border">
                    <button id="show-trip-unlock-password" type="button" aria-controls="trip-unlock-password" aria-pressed="false" class="ui-control ui-small shrink-0 bg-slate-100 px-3">顯示</button>
                </div>
                <p id="trip-unlock-error" role="alert" class="text-sm text-red-700"></p>
            </div>
            <div class="dialog-actions">
                <button id="cancel-trip-unlock" type="button" class="ui-control ui-large bg-slate-100 px-4">取消</button>
                <button id="submit-trip-unlock" type="submit" class="ui-control ui-large bg-[#0284c7] px-4 text-white">解鎖</button>
            </div>
        </form>
    </dialog>

    <dialog id="place-info-dialog" aria-labelledby="place-info-title" class="rounded-2xl p-0 w-[90vw] max-w-md max-h-[85vh] backdrop:bg-slate-900/50">
        <div class="dialog-layout">
            <div class="flex items-center justify-between gap-3">
                <div class="grid min-w-0 gap-1.5">
                    <p class="flex flex-wrap items-center gap-2 text-sm text-slate-600">
                        <span id="place-info-category"></span>
                        <span id="place-info-area"></span>
                    </p>
                    <h2 id="place-info-title" tabindex="-1" autofocus class="min-w-0 break-words text-lg font-bold text-slate-800"></h2>
                </div>
                <a id="place-info-map" class="ui-control ui-large place-map inline-flex items-center shrink-0 whitespace-nowrap border border-orange-200 bg-orange-50 px-3 font-medium text-orange-800 hover:border-orange-300 hover:bg-orange-100" target="_blank" rel="noopener noreferrer" aria-label="開啟景點地圖"><i class="fa-solid fa-diamond-turn-right mr-1" aria-hidden="true"></i>地圖</a>
            </div>
            <div class="dialog-body space-y-3">
                <p id="place-info-address" class="break-words text-sm text-sky-700"><i class="fa-solid fa-location-dot mr-1.5 text-xs" aria-hidden="true"></i><span id="place-info-address-text"></span></p>
                <p id="place-info-highlight" class="break-words text-sm font-semibold text-rose-700"></p>
                <div id="place-info-description" class="break-words rounded-[8px] border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm leading-relaxed text-slate-600"></div>
            </div>
            <form method="dialog" class="dialog-actions">
                <button type="submit" class="ui-control ui-large bg-slate-100 px-4 text-slate-700">關閉</button>
            </form>
        </div>
    </dialog>

    <dialog id="place-dialog" aria-labelledby="place-form-title" class="rounded-2xl p-0 w-[90vw] max-w-lg max-h-[90vh] backdrop:bg-slate-900/50">
        <form id="place-form" class="dialog-layout">
            <h2 id="place-form-title" tabindex="-1" autofocus class="text-lg font-bold text-slate-800">
                <span id="place-form-title-text">新增景點／美食</span>
            </h2>
            <div class="dialog-body space-y-2.5">
            <fieldset id="place-edit-fields" class="space-y-3">
            <p class="text-sm text-slate-500"></p>
            <label class="block text-sm"><span class="place-required-label"><span aria-hidden="true">*</span>分類</span><select name="type" class="ui-control ui-large block w-full border px-2 mt-1"><option value="attraction">景點</option><option value="restaurant">美食</option></select></label>
            <label class="block text-sm"><span class="place-required-label"><span aria-hidden="true">*</span>地點名稱</span><input name="name" required maxlength="100" class="ui-control ui-large block w-full px-2 border mt-1"></label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label class="block text-sm"><span class="place-required-label"><span aria-hidden="true">*</span>地址</span><input name="location" maxlength="300" aria-describedby="place-location-hint" class="ui-control ui-large block w-full px-2 border mt-1"></label>
                <label class="block text-sm">地區<input name="tag" maxlength="50" placeholder="例如：中正區" class="ui-control ui-large block w-full px-2 border mt-1"></label>
            </div>
            <label class="block text-sm"><span class="place-required-label"><span aria-hidden="true">*</span>地圖網址</span><input name="mapUrl" type="url" maxlength="2000" aria-describedby="place-location-hint" class="ui-control ui-large block w-full px-2 border mt-1"></label>
            <p id="place-location-hint" class="text-xs text-slate-600">貼上 Google 地圖網址，可自動帶入查得到的資料。只填地址時，會自動產生地圖連結。</p>
            <p id="place-map-status" role="status" hidden class="text-xs text-slate-600"></p>
            <label class="block text-sm">介紹／營業時間<textarea name="desc" maxlength="5000" rows="4" placeholder="可分行填寫營業時間、推薦餐點與注意事項" class="block w-full border rounded-xl p-2 mt-1"></textarea></label>
            <label class="block text-sm">重點提醒<input name="highlight" maxlength="300" placeholder="例如：已訂位 11:30（2位）" class="ui-control ui-large block w-full px-2 border mt-1"></label>
            </fieldset>
            <p id="place-error" role="alert" class="text-sm text-rose-600"></p>
            </div>
            <div class="dialog-actions">
                <button id="delete-place" type="button" hidden class="ui-control ui-large bg-rose-50 px-3 font-semibold text-rose-700 hover:bg-rose-100">刪除</button>
                <button type="button" id="cancel-place" class="ui-control ui-large bg-slate-100 px-3">取消</button>
                <button id="save-place" type="submit" class="ui-control ui-large bg-[#0284c7] px-3 text-white">儲存</button>
            </div>
        </form>
    </dialog>
    <!-- JavaScript 邏輯 -->
    <script defer src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh-tw.js"></script>
    <script defer src="./js/itinerary.js"></script>
</body>
</html>
