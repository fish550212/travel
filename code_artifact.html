<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>魚你同行</title>
    <link rel="icon" type="image/png" href="./頭像-01.png">
   <title>魚你同行｜線上旅遊行程規劃與景點地圖工具</title>
<meta name="description" content="「魚你同行」是一款輕量化線上旅遊規劃工具，支援自訂多日行程表、分類管理景點與美食清單、整合住宿資訊與一鍵地圖導航，並提供密碼保護與即時同步功能，輕鬆整理並分享專屬旅程。">
<meta name="keywords" content="旅遊行程規劃,線上行程表,景點美食清單,旅遊地圖導航,自由行規劃工具,魚你同行">
<meta property="og:title" content="魚你同行｜線上旅遊行程規劃與景點地圖工具">
<meta property="og:description" content="集中管理旅遊行程、景點美食、住宿地址與地圖導航，支援即時同步與編輯密碼鎖定，讓行前規劃與旅途查詢更直覺。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fish550212.github.io/travel/code_artifact.html">
    <meta property="og:locale" content="zh_TW">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            font-size: 1.1rem; /* 文字放大 10% */
        }
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.03), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }
        @media (min-width: 640px) {
            .sm\:text-2xl {
                font-size: 1.3rem !important;
                line-height: 2rem !important;
            }
        }
        .mobile-nav {
            display: none;
        }
        .trip-section {
            padding: 10px 15px;
        }
        dialog h2[autofocus]:focus { outline: none; }
        .place-required-label { display: inline-flex; align-items: baseline; gap: .2rem; }
        .place-required-label > span { color: #be123c; }
        :is(#edit-itinerary, #edit-reminder, #edit-stay):enabled:hover,
        #edit-itinerary:active,
        #edit-itinerary[aria-pressed="true"] { color: #075985; }
        .page-header { --page-header-height: 60px; }
        #edit-trip-password[hidden] { display: none; }
        .page-header-inner { height: var(--page-header-height); }
        #trip-header-title {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            line-height: 1.1;
            font-size: clamp(0.7rem, calc(.8rem + .5vw), 1rem);
        }
        * {
            scrollbar-width: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }
        #trip-date-row .ui-control {
            block-size: calc(var(--control-height) + 4px);
        }
        #trip-day-tabs {
            --day-tab-gap: 7px;
            gap: var(--day-tab-gap);
        }
        #trip-day-tabs > button {
            position: relative;
            flex: 1 0 4.25rem;
        }
        #trip-day-tabs > button + button::before {
            content: "";
            position: absolute;
            inset-block: 25%;
            inset-inline-start: calc(var(--day-tab-gap) / -2);
            border-inline-start: 1px solid #cbd5e1;
            transform: translateX(-50%);
            pointer-events: none;
        }
        [data-reorder] { touch-action: none; user-select: none; }
        .stop-editor summary::-webkit-details-marker { display: none; }
        .stop-action-icon {
            display: inline-grid;
            width: 100%;
            height: 100%;
            place-items: center;
            border: 1px solid #e2e8f0;
            border-radius: inherit;
            line-height: 1;
        }
        .stop-action-edit { background: #f1f5f9; color: #475569; }
        .stop-action-edit .fa-check,
        .stop-editor[open] .stop-action-edit .fa-pen { display: none; }
        .stop-editor[open] .stop-action-edit .fa-check { display: inline-block; }
        .stop-editor[open] .stop-action-edit { border-color: #0369a1; background: #0369a1; color: #fff; }
        .stop-action-remove { border-color: #fecdd3; background: #fff1f2; color: #be123c; }
        [data-stop-index]:has(.stop-editor[open]) > [data-note-preview] { display: none; }
        #itinerary-list [data-stop-index] {
            transform: translateY(var(--reorder-shift, 0px));
            transition: transform 190ms cubic-bezier(.25, .8, .3, 1);
        }
        #itinerary-list [data-dragging] { opacity: 0; }
        body > .reorder-lifted {
            position: fixed;
            z-index: 60;
            pointer-events: none;
            margin: 0;
            background: #fff;
            box-shadow: 0 10px 26px rgb(15 23 42 / 22%);
            transition: none;
        }
        @media (prefers-reduced-motion: reduce) {
            #itinerary-list [data-stop-index] { transition: none; }
        }
        .title-icon {
            display: inline-grid;
            width: 20px;
            height: 20px;
            flex: 0 0 20px;
            place-items: center;
            font-size: 16px;
            line-height: 1;
        }
        .title-icon > i {
            width: 1.25em;
            text-align: center;
        }
        .reminder-copy {
            display: block;
            max-width: 100%;
            min-height: 1.625em;
            overflow: hidden;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        #trip-reminders:not([data-resizing]) #toggle-reminder[aria-expanded="false"] .reminder-copy {
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        #trip-reminders[data-resizing] {
            overflow: hidden;
        }
        @media (width >= 1024px) {
            #trip-day-tabs { --day-tab-gap: 8px; }
            body { height: 100dvh; overflow-y: auto; }
            body > header { flex-shrink: 0; }
            main.trip-workspace { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); min-height: var(--itinerary-min-height, 0px); }
            .trip-pane { display: flex; flex-direction: column; min-height: 0; }
            .trip-pane-scroll { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
        }
        @media (width < 1024px) {
            /* Prevent iOS Safari from zooming when a small form control receives focus. */
            dialog :is(input:not([type="checkbox"], [type="radio"]), textarea, select),
            .stop-editor :is(input, select) {
                font-size: max(16px, 1rem);
            }
            dialog[id] {
                width: 80vw;
                max-width: none;
                max-height: 80dvh;
            }
            .trip-workspace[data-view="itinerary"] #trip-places,
            .trip-workspace[data-view="places"] #trip-plan { display: none; }
            main.trip-workspace {
                padding-bottom: calc(96px + env(safe-area-inset-bottom));
            }
            #trip-date-row {
                position: sticky;
                top: var(--trip-date-sticky-top, 60px);
                z-index: 25;
            }
            #trip-date-row.is-stuck {
                /* Extend past the workspace gutter and the itinerary card padding. */
                margin-inline: calc(-1rem - 16px);
                padding-inline-start: max(1rem, env(safe-area-inset-left));
                padding-inline-end: max(1rem, env(safe-area-inset-right));
                border-radius: 0;
            }
            .places-heading {
                position: sticky;
                top: var(--places-sticky-top, 60px);
                z-index: 30;
                margin-inline: -1rem;
                padding: 7px max(1rem, env(safe-area-inset-right)) 7px max(1rem, env(safe-area-inset-left));
                background: #f8fafc;
            }
            .places-heading.is-stuck {
                box-shadow: 0 3px 6px -4px #0f172a7d;
            }
            .mobile-nav-target {
                scroll-margin-top: calc(5.5rem + env(safe-area-inset-top));
            }
            #open-stay,
            #cloud-sync-status {
                display: none;
            }
            .mobile-nav {
                position: fixed;
                bottom: calc(12px + env(safe-area-inset-bottom));
                left: max(14px, env(safe-area-inset-left));
                right: max(14px, env(safe-area-inset-right));
                max-width: 320px;
                margin-inline: auto;
                z-index: 40;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 4px;
                padding: 6px;
                background: #fff;
                border: 1px solid rgb(10 80 123 / 19%);
                border-radius: 999px;
                box-shadow: 0 7px 22px rgb(10 80 123 / 15%), inset 0 1px 0 rgb(255 255 255 / 90%);
            }
            .mobile-nav :is(a, button) {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 5px;
                min-height: 54px;
                padding: 4px 2px;
                border-radius: 999px;
                color: #0a507b;
                font-size: .75rem;
                font-weight: 700;
                line-height: 1.25;
                text-decoration: none;
            }
            .mobile-nav i {
                font-size: 1rem;
            }
            .mobile-nav::before {
                content: "";
                position: absolute;
                inset: 6px auto 6px 6px;
                width: calc((100% - 20px) / 3);
                border-radius: 999px;
                background: rgb(10 80 123 / 12%);
                pointer-events: none;
                transform: translateX(calc(var(--selected-nav-index, 0) * (100% + 4px)));
                transition: transform 280ms cubic-bezier(.22, .8, .3, 1);
            }
            body:has(.trip-workspace[data-view="places"]) .mobile-nav { --selected-nav-index: 1; }
            .mobile-nav :is(a, button):focus-visible {
                outline: 2px solid #0284c7;
                outline-offset: -2px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .mobile-nav::before {
                transition: none;
            }
        }
        @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            @media (width < 1024px) {
                .mobile-nav {
                    background: rgb(255 255 255 / 78%);
                    -webkit-backdrop-filter: blur(18px) saturate(135%);
                    backdrop-filter: blur(18px) saturate(135%);
                }
            }
        }
        @media (prefers-reduced-transparency: reduce) {
            .mobile-nav {
                background: #fff;
                -webkit-backdrop-filter: none;
                backdrop-filter: none;
            }
        }
        #add-feedback { position: fixed; z-index: 45; right: 1rem; bottom: 1rem; }
        @media (width < 1024px) {
            #add-feedback { bottom: calc(88px + env(safe-area-inset-bottom)); }
        }
    </style>
    <link rel="stylesheet" href="./controls.css">
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen flex flex-col">

    <!-- 頂部導航列：改為單一清新水藍色（無漸層） -->
    <header class="page-header bg-[#0a507b] text-slate-50 shadow-sm sticky  top-0 z-50">
        <div class="page-header-inner max-w-7xl mx-auto px-3 sm:px-4 flex flex-row justify-between items-center gap-2 sm:gap-3">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0 flex-1">
                <a id="back-to-trip-list" href="./index.html" aria-label="返回旅行列表" title="返回旅行列表" class="ui-control ui-small ui-square inline-grid shrink-0 place-items-center text-sky-100 hover:text-white focus-visible:outline-white"><i class="fa-solid fa-chevron-left text-sm" aria-hidden="true"></i></a>
                
                <div class="min-w-0">
                    <h1 id="trip-header-title" class="font-bold tracking-tight break-words">您的旅遊計畫</h1>
                    <p id="trip-header-dates" class="mt-0.5 truncate text-xs leading-tight text-sky-100"></p>
                </div>
            </div>
            <div class="flex shrink-0 justify-end items-center gap-2 max-w-[65%] sm:max-w-none">
                <!-- 雲端同步狀態指示器 -->
                <div id="cloud-sync-status" role="status" class="ui-icon-16 text-sky-100 text-xs flex min-h-8 min-w-8 items-center justify-center gap-1.5">
                    <i class="fa-solid fa-cloud text-sky-200" aria-hidden="true"></i>
                    <span id="sync-text" class="sr-only">同步中</span>
                </div>
                <span style="display: none;" id="completed-counter" class="bg-black/20 text-sm px-3.5 py-1.5 rounded-full border border-white/10 hidden sm:flex items-center gap-1.5 text-sky-100">
                    <i class="fa-solid fa-circle-check text-sky-200"></i> 總景點數 <span id="total-count">12</span> 個
                </span>
                <button style="display: none;"  id="reset-schedules" disabled hidden onclick="resetAllSchedules()" class="ui-control ui-large bg-white/10 hover:bg-white/20 px-3.5 transition border border-white/20 flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> 重置行程
                </button>
                <button id="edit-trip-password" type="button" disabled aria-label="密碼設定" title="密碼設定" class="ui-icon-16 ui-control ui-small ui-square inline-grid shrink-0 place-items-center text-sky-100 hover:bg-white/10 focus-visible:outline-white disabled:opacity-50">
                    <i id="trip-password-icon" class="fa-solid fa-lock-open text-sm" aria-hidden="true"></i>
                </button>
                <button id="edit-trip-title" type="button" disabled aria-label="旅程編輯" title="旅程編輯" class="ui-icon-16 ui-control ui-small ui-square inline-grid shrink-0 place-items-center text-sky-100 hover:bg-white/10 focus-visible:outline-white disabled:opacity-50">
                    <i class="fa-solid fa-calendar-days text-sm" aria-hidden="true"></i>
                </button>
                <button id="open-stay" type="button" aria-label="查看住宿資訊" aria-haspopup="dialog" aria-controls="trip-stay" title="住宿資訊" class="ui-icon-16 ui-control ui-small ui-square inline-grid shrink-0 place-items-center text-sky-100 hover:bg-white/10 focus-visible:outline-white">
                    <i class="fa-solid fa-bed text-sm" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區：採用左右排版 -->
    <main id="trip-workspace" data-view="itinerary" class="trip-workspace max-w-7xl mx-auto px-4 py-4 w-full grid grid-cols-1 gap-4 flex-1">

        <!-- 左側：三日行程規劃表 (5欄) -->
        <div id="trip-plan" class="trip-pane min-w-0 space-y-[10px]">
            <div class="flex min-w-0 shrink-0 flex-col gap-[10px]">
            
            <!-- 防呆小幫手區塊 -->
            <section id="trip-reminders" class="trip-section min-w-0 bg-white border border-slate-200 rounded-[8px] shadow-xs" aria-labelledby="reminder-title">
                <div class="flex items-center gap-2 mb-2">
                    <div class="title-icon text-rose-400" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <h2 id="reminder-title" class="font-bold text-slate-800 text-lg">重要提醒</h2>
                    <button id="edit-reminder" type="button" disabled aria-label="編輯重要提醒" title="編輯重要提醒" class="ui-control ui-large ui-square ui-icon-16 ml-auto inline-grid shrink-0 place-items-center text-slate-500 focus-visible:outline-sky-700 disabled:opacity-50">
                        <i class="fa-solid fa-gear" aria-hidden="true"></i>
                    </button>
                </div>
                <button id="toggle-reminder" type="button" aria-expanded="false" aria-controls="reminder-text" class="block w-full text-left text-sm text-slate-600 leading-relaxed rounded focus-visible:outline-sky-700">
                    <span id="reminder-text" class="reminder-copy">載入中...</span>
                </button>
            </section>

            </div>

            <div id="trip-itinerary" class="trip-section min-h-0 flex-1 bg-white rounded-[8px] border border-slate-200 flex flex-col">
                <div id="itinerary-toolbar" class="mb-[10px] flex items-center justify-between gap-3">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2 text-lg">
                        <span class="title-icon text-[#0284c7]" aria-hidden="true"><i class="fa-solid fa-calendar-days"></i></span> 行程表
                    </h3>
                    <button id="edit-itinerary" type="button" onclick="toggleItineraryEdit()" aria-pressed="false" aria-label="調整行程" title="調整行程" class="ui-control ui-large ui-square ui-icon-16 inline-grid shrink-0 place-items-center text-slate-500 focus-visible:outline-sky-700 disabled:opacity-50">
                        <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                    </button>
                </div>
                <div id="trip-date-marker" aria-hidden="true" class="h-px -mb-px shrink-0"></div>
                <div id="trip-date-row" class="mb-[10px] flex min-w-0 shrink-0 gap-1 rounded-xl bg-slate-100 p-1">
                    <div id="trip-day-tabs" role="group" aria-label="行程日期" class="flex min-w-0 flex-1 overflow-x-auto"></div>
                    <button id="add-trip-day" type="button" aria-label="新增一天行程" title="新增一天行程" disabled class="ui-control ui-large ui-square mx-1 grid shrink-0 place-items-center self-center bg-transparent leading-none text-slate-600 hover:text-sky-700 focus-visible:outline-sky-700 disabled:opacity-50"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
                </div>

                <!-- 行程站點清單 -->
                <div id="itinerary-list" class="trip-pane-scroll space-y-[10px] flex-grow">
                    <!-- 動態載入 -->
                </div>
            </div>
        </div>

        <!-- 右側：可用景點與美食資料庫 (7欄) -->
        <div id="trip-places" class="trip-pane relative min-w-0 space-y-[10px]">
            <div class="places-heading flex items-center justify-between gap-2">
                <h2 class="flex items-center gap-2 text-lg font-bold text-slate-800">
                    <span class="title-icon text-[#0284c7]" aria-hidden="true"><i class="fa-solid fa-compass"></i></span> 規劃景點
                </h2>
                <label class="text-xs font-semibold text-slate-600">旅遊日期
                    <select id="explore-day" onchange="switchDay(this.value)" class="ui-control ui-small ml-1 border border-slate-200 bg-white px-2 text-slate-800">
                    </select>
                </label>
            </div>
            
            <div class="flex flex-col gap-2 bg-white p-3 rounded-[8px] border border-slate-200">
                <!-- 搜尋列 -->
                <div class="flex items-stretch gap-2">
                    <div class="relative min-w-0 flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm" aria-hidden="true"></i>
                        <input type="text" id="search-input" oninput="searchItems()" placeholder="搜尋景點、美食或地區..." class="ui-control ui-large w-full pl-10 pr-4 bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0284c7]">
                    </div>
                    <button id="add-place" type="button" onclick="openPlaceForm()" disabled class="ui-control ui-large shrink-0 whitespace-nowrap bg-sky-700 px-3 font-semibold text-white hover:bg-sky-800 disabled:opacity-50"><i class="fa-solid fa-plus mr-1" aria-hidden="true"></i>新增</button>
                </div>

                <!-- 分類篩選 -->
                <div class="flex gap-1.5 shrink-0 w-full sm:w-auto">
                    <button onclick="filterItems('all')" id="filter-all" class="ui-control ui-small filter-btn bg-[#0284c7] text-white px-3 font-medium transition shadow-xs">全部</button>
                    <button onclick="filterItems('attraction')" id="filter-attraction" class="ui-control ui-small filter-btn bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 font-medium transition">景點</button>
                    <button onclick="filterItems('restaurant')" id="filter-restaurant" class="ui-control ui-small filter-btn bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 font-medium transition">美食</button>
                </div>
            </div>

            <p id="place-status" role="status" class="text-sm text-slate-500 empty:hidden"></p>
            <div id="add-feedback" hidden class="rounded-xl border border-sky-200 bg-sky-50 px-3 py-2 text-sm text-sky-900">
                <span id="add-feedback-text" role="status"></span>
                <button id="undo-add" type="button" class="ui-control ui-small ml-2 font-bold underline">復原</button>
            </div>
            <!-- 清單容器 -->
            <div id="items-container" class="trip-pane-scroll space-y-[10px]">
                <!-- 動態載入項目 -->
            </div>
            <span id="places-sticky-marker" class="pointer-events-none absolute left-0 top-0 h-px w-px !m-0" aria-hidden="true"></span>
        </div>

    </main>

    <nav class="mobile-nav" aria-label="行程區塊">
        <a id="nav-itinerary" href="#trip-itinerary" aria-current="true" onclick="switchTripView(event, 'itinerary')"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i><span>行程</span></a>
        <a id="nav-places" href="#trip-places" onclick="switchTripView(event, 'places')"><i class="fa-solid fa-compass" aria-hidden="true"></i><span>景點</span></a>
        <button id="nav-stay" type="button" aria-haspopup="dialog" aria-controls="trip-stay"><i class="fa-solid fa-bed" aria-hidden="true"></i><span>住宿</span></button>
    </nav>

    <dialog id="trip-stay" aria-labelledby="stay-title" class="trip-section rounded-2xl w-[calc(100%-2rem)] max-w-lg max-h-[90vh] backdrop:bg-slate-900/50">
            <div class="flex items-center gap-2 mb-3">
                <h2 id="stay-title" tabindex="-1" autofocus class="font-bold text-slate-800 text-lg flex items-center gap-2">
                    <span class="title-icon text-[#0284c7]" aria-hidden="true"><i class="fa-solid fa-bed"></i></span> 住宿資訊
                </h2>
                <button id="edit-stay" type="button" disabled aria-label="編輯住宿資訊" title="編輯住宿資訊" class="ui-control ui-large ui-square ui-icon-16 ml-auto inline-grid shrink-0 place-items-center text-slate-500 focus-visible:outline-sky-700 disabled:opacity-50">
                    <i class="fa-solid fa-gear" aria-hidden="true"></i>
                </button>
            </div>
            <p id="stay-name" hidden class="mb-1 text-sm font-semibold text-slate-800 break-words"></p>

        function placeRegionFromAddress(address) {
            const normalized = address.normalize('NFKC').replace(/\s+/g, '')
                .replace(/^(?:台灣|臺灣)?(?:[0-9]{3}(?:[0-9]{2,3})?)?/, '');
            const locality = normalized.match(/^[\p{Script=Han}]{2,3}[縣市]([\p{Script=Han}]{1,3}?[鄉鎮市區])/u);
            return locality?.[1] ?? '';
        }

        function placeRegionFromMapUrl(value) {
            try {
                const url = new URL(value);
                if (!/^https?:$/.test(url.protocol) ||
                    !/^(?:(?:www|maps)\.)?google\.(?:com(?:\.tw)?|tw)$/.test(url.hostname)) return '';
                for (const key of ['query', 'q', 'address']) {
                    const region = placeRegionFromAddress(url.searchParams.get(key) ?? '');
                    if (region) return region;
                }
                const place = url.pathname.match(/^\/maps\/(?:place|search)\/([^/]+)/);
                if (!place) return '';
                return placeRegionFromAddress(decodeURIComponent(place[1].replace(/\+/g, ' ')));
            } catch {
                return '';
            }
        }

        function getTripDateRange() {
            if (tripData.dateRange) return tripData.dateRange;
            if (tripData.dates) return {departureDate: tripData.dates.day1, returnDate: tripData.dates.day3};
            return defaultDateRange;
        }

        function reassignSchedulesByDate(departureDate, returnDate) {
            const previous = getTripDateRange();
            if (departureDate === previous.departureDate && returnDate === previous.returnDate) return;
            const previousStart = Date.parse(previous.departureDate + 'T00:00:00Z');
            const newStart = Date.parse(departureDate + 'T00:00:00Z');
            const schedules = new Map();
            for (const key of savedScheduleDays()) {
                const schedule = getSchedule(key);
                if (schedule.ids.length || Object.keys(schedule.notes).length) {
                    const date = key.startsWith('date-') ? key.slice(5)
                        : new Date(previousStart + (Number(key.slice(3)) - 1) * dayMs).toISOString().slice(0, 10);
                    schedules.set(date, schedule);
                }
                delete tripData[key];
            }
            for (const day of ['day1', 'day2', 'day3']) tripData[day] = getSchedule(day);
            for (const [date, schedule] of schedules) {
                const key = date >= departureDate && date <= returnDate
                    ? 'day' + (1 + (Date.parse(date + 'T00:00:00Z') - newStart) / dayMs)
                    : 'date-' + date;
                tripData[key] = schedule;
            }
            const selectedDate = previousStart + (Number(currentDay.slice(3)) - 1) * dayMs;
            const newDay = 'day' + (1 + (selectedDate - newStart) / dayMs);
            currentDay = selectedDate >= newStart && selectedDate <= Date.parse(returnDate + 'T00:00:00Z') ? newDay : 'day1';
        }

        function renderTripDays() {
            const {departureDate, returnDate} = getTripDateRange();
            const range = departureDate + '/' + returnDate;
            if (range === renderedDateRange) return;
            const end = Date.parse(returnDate + 'T00:00:00Z');
            dayLabels = {};
            const tabs = [];
            const options = [];
            for (let time = Date.parse(departureDate + 'T00:00:00Z'), index = 1; time <= end; time += dayMs, index++) {
                const day = 'day' + index;
                const date = new Date(time);
                const label = date.toISOString().slice(5, 10).replace('-', '/');
                dayLabels[day] = label;
                tabs.push(`<button type="button" id="tab-${day}" onclick="switchDay('${day}')" aria-label="${label} (${tripWeekday.format(date)})，第 ${index} 天" class="ui-control ui-large flex min-w-[4.25rem] shrink-0 flex-col items-center justify-center whitespace-nowrap px-3 font-bold transition focus-visible:outline-sky-700"><span class="text-s font-normal">${date.getUTCMonth() + 1}/${date.getUTCDate()}</span><span>第${index}天</span></button>`);
                options.push(`<option value="${day}">${label}</option>`);
            }
            if (!Object.hasOwn(dayLabels, currentDay)) currentDay = 'day1';
            document.getElementById('trip-day-tabs').innerHTML = tabs.join('');
            document.getElementById('explore-day').innerHTML = options.join('');
            updateSelectedDay();
            renderedDateRange = range;
        }

        // 初始化 Firebase 與身分驗證

        function updateSyncStatus(text, color = 'text-sky-200', icon = 'fa-cloud') {
            const el = document.getElementById('cloud-sync-status');
            if (!el) return;
            const showMessage = color === 'text-rose-300' || color === 'text-amber-300';
            el.title = text;
            el.innerHTML = `<i class="fa-solid ${icon} ${color}" aria-hidden="true"></i><span class="${showMessage ? '' : 'sr-only'}">${text}</span>`;
        }
        function requestEditingSignIn() {
            window.location.href = '/signin-with-chatgpt?return_to=' + encodeURIComponent(itineraryReturnPath);
        }

        async function requestItinerary(options, password = tripPassword) {
            if (!githubHosted) {
                const headers = {...options.headers};
                if (password) {
                    headers['Content-Type'] = 'application/json';
                    const payload = options.body ? JSON.parse(options.body) : {};
                    return fetch(itineraryApi,{...options,method:options.method ?? 'POST',headers,body:JSON.stringify({...payload,password})});
                }
                return fetch(itineraryApi, {...options,headers});
            }
            const action = options.method === 'PUT' ? 'travel-save' : 'travel-read';
            const payload = options.body ? JSON.parse(options.body) : {};
            const response = await fetch(sheetsEndpoint, {
                method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'},
                body:JSON.stringify({...payload,action,id:tripId,password})
            });
            if (!response.ok) return response;
            const data = await response.json();
            if (!data.error && action === 'travel-read') passwordSupported = data.passwordSupport === true;
            const status = data.error ? ({forbidden:403,not_found:410,conflict:409,invalid_data:400,locked:423}[data.error] ?? 503) : 200;
            return new Response(JSON.stringify(data), {status});
        }

        async function fetchCloud(password = tripPassword) {
            if (useSheets) return requestSheets('read');
            const r = await requestItinerary({cache: 'no-store'}, password);
            if (r.status === 410) window.location.replace('./index.html');
            if (!r.ok) throw Error('Cloud unavailable');
            return r.json();
        }
        async function requestSheets(action, payload = {}) {
            const response = await fetch(sheetsEndpoint, {
                method: 'POST',
                headers: {'Content-Type': 'text/plain;charset=UTF-8'},
                body: JSON.stringify({action, ...payload})
            });
            if (!response.ok) throw Error('storage_unavailable');
            const data = await response.json();
            if (data.error) throw Error(data.error);
            if (!Number.isSafeInteger(data.revision)) throw Error('storage_unavailable');
            return data;
        }
        async function previewPasswordDigest(password, salt) {
            const encoder = new TextEncoder();
            const key = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits']);
            const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:encoder.encode(salt), iterations:100000, hash:'SHA-256'}, key, 256);
            return Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, '0')).join('');
        }

        async function initFirebase() {
            if (localPreview) {
                let draft;
                try { draft = JSON.parse(sessionStorage.getItem('yilan_trip_preview')); } catch { /* Storage can be unavailable for local files. */ }
                try {
                    if (draft) tripData = draft;
                    else {
                        const data = await fetchCloud();
                        if (data.tripData) tripData = data.tripData;
                    }
                } catch { /* The preview also works with empty schedules. */ }
                try { previewLock = JSON.parse(sessionStorage.getItem(previewLockKey)); } catch { /* Storage can be unavailable. */ }
                tripLocked = canUnlockTrip = !!previewLock;
                syncReady = true;
                canEdit = !tripLocked;
                updateSyncStatus('本機預覽', 'text-sky-200', 'fa-floppy-disk');
                renderAll();
                return;
            }
            if (useBrowserStorage) {
                canEdit = syncReady = true;
                try {
                    loadFromLocalStorage();
                    updateSyncStatus('使用此瀏覽器儲存', 'text-sky-200', 'fa-floppy-disk');
                } catch {
                    updateSyncStatus('無法讀取瀏覽器中的行程', 'text-rose-300', 'fa-circle-exclamation');
                }
                renderAll();
                return;
            }
            try {
                const data = await fetchCloud();
                canEdit = data.canEdit;
                tripLocked = !!data.locked;
                canUnlockTrip = !!data.canUnlock;
                cloudRevision = data.revision;
                if (data.tripData) tripData = data.tripData;
                else if (canEdit && !useSheets && !githubHosted) {
                    loadFromLocalStorage();
                    pendingSave = savedScheduleDays().some(day => getSchedule(day).ids.length) || !!tripData.dateRange || !!tripData.dates || !!tripData.customItems?.length || !!tripData.deletedItemIds?.length;
                }
                syncReady = true;
                renderAll();
                if (pendingSave) await saveCloudData();
                else updateSyncStatus('\u96f2\u7aef\u5df2\u540c\u6b65', 'text-emerald-300');
            } catch {
                updateSyncStatus('連線失敗，請重新整理', 'text-rose-300');
                renderAll();
            }
        }
        async function saveCloudData() {
            if (localPreview) {
                try {
                    sessionStorage.setItem('yilan_trip_preview', JSON.stringify(tripData));
                    const passwordChange = pendingPasswordChange;
                    if (passwordChange !== undefined) {
                        if (passwordChange === null) {
                            sessionStorage.removeItem(previewLockKey);
                            previewLock = null;
                        } else {
                            const salt = crypto.randomUUID();
                            const lock = {salt,digest:await previewPasswordDigest(passwordChange, salt)};
                            sessionStorage.setItem(previewLockKey, JSON.stringify(lock));
                            previewLock = lock;
                        }
                        if (pendingPasswordChange === passwordChange) pendingPasswordChange = undefined;
                        tripLocked = canUnlockTrip = !!previewLock;
                        tripPassword = passwordChange ?? '';
                    }
                    updateSyncStatus('已儲存預覽', 'text-emerald-300', 'fa-floppy-disk');
                } catch {
                    updateSyncStatus('預覽僅保留在本頁', 'text-amber-300');
                }
                return;
            }
            const savedLocally = saveToLocalStorage();
            if (useBrowserStorage) {
                if (savedLocally) updateSyncStatus('已儲存在此瀏覽器', 'text-emerald-300', 'fa-floppy-disk');
                else updateSyncStatus('瀏覽器儲存失敗', 'text-rose-300', 'fa-circle-exclamation');
                return;
            }
            pendingSave = true;
            if (saving || syncConflict || !syncReady) return;
            saving = true;
            try {
                while (pendingSave) {
                    pendingSave = false;
                    updateSyncStatus('\u5132\u5b58\u4e2d\u2026');
                    const passwordChange = pendingPasswordChange;
                    const payload = {tripData, revision: cloudRevision, passwordChange};
                    if (useSheets) {
                        cloudRevision = (await requestSheets('save', payload)).revision;
                    } else {
                        const r = await requestItinerary({method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)});
                        if (r.status === 423) {
                            canEdit = false;
                            tripLocked = canUnlockTrip = true;
                            tripPassword = '';
                            pendingPasswordChange = undefined;
                            updateSyncStatus('旅程已鎖定，請重新解鎖。', 'text-rose-300', 'fa-circle-exclamation');
                            renderAll();
                            return;
                        }
                        if (r.status === 409) throw Error('conflict');
                        if (!r.ok) throw Error('Save failed');
                        cloudRevision = (await r.json()).revision;
                        if (passwordChange !== undefined) {
                            tripLocked = canUnlockTrip = passwordChange !== null;
                            tripPassword = passwordChange ?? '';
                            if (pendingPasswordChange === passwordChange) pendingPasswordChange = undefined;
                        }
                    }
                }
                updateSyncStatus('\u96f2\u7aef\u5df2\u540c\u6b65', 'text-emerald-300');
            } catch (error) {
                syncConflict = error.message === 'conflict';
                pendingSave = true;
                updateSyncStatus(syncConflict ? '\u7248\u672c\u885d\u7a81\uff0c\u8acb\u91cd\u65b0\u6574\u7406' : '\u5c1a\u672a\u540c\u6b65\uff0c\u9023\u7dda\u5f8c\u81ea\u52d5\u91cd\u8a66', 'text-rose-300');
            } finally { saving = false; }
        }
        setInterval(async () => {
            if (localPreview || useBrowserStorage || !syncReady || saving || syncConflict) return;
            if (pendingSave) { saveCloudData(); return; }
            if (isEditing || detailsDialog.open || unlockDialog.open || document.hidden || document.getElementById('place-dialog').open) return;
            try {
                const data = await fetchCloud();
                if (pendingSave || saving || isEditing || detailsDialog.open || document.getElementById('place-dialog').open) return;
                if (data.revision !== cloudRevision) {
                    cloudRevision = data.revision;
                    canEdit = data.canEdit;
                    tripLocked = !!data.locked;
                    canUnlockTrip = !!data.canUnlock;
                    if (data.tripData) tripData = data.tripData;
                    renderAll();
                }
                updateSyncStatus('\u96f2\u7aef\u5df2\u540c\u6b65', 'text-emerald-300');
            } catch { updateSyncStatus('\u9023\u7dda\u4e2d\u65b7\uff0c\u6b63\u5728\u91cd\u8a66', 'text-amber-300'); }
        }, 5000);
        window.addEventListener('beforeunload', event => {
            if (pendingSave || saving) { event.preventDefault(); event.returnValue = ''; }
        });

        function saveToLocalStorage() {
            try {
                localStorage.setItem('yilan_places', JSON.stringify({customItems:tripData.customItems || [], deletedItemIds:tripData.deletedItemIds || []}));
                const schedules = Object.fromEntries(savedScheduleDays().map(day => [day, tripData[day]]));
                localStorage.setItem('yilan_schedules', JSON.stringify(schedules));
                localStorage.setItem('yilan_trip_details', JSON.stringify({title: tripData.title, dateRange: tripData.dateRange, dates: tripData.dates, reminder: tripData.reminder, stay: tripData.stay}));
                return true;
            } catch { return false; }
        }

        function loadFromLocalStorage() {
            const places = JSON.parse(localStorage.getItem('yilan_places') || '{}');
            tripData.customItems = places.customItems || [];
            tripData.deletedItemIds = places.deletedItemIds || [];
            const d1 = localStorage.getItem('yilan_schedule_day1');
            const d2 = localStorage.getItem('yilan_schedule_day2');
            const d3 = localStorage.getItem('yilan_schedule_day3');
            const schedules = localStorage.getItem('yilan_schedules');
            if (schedules) {
                for (const [day, schedule] of Object.entries(JSON.parse(schedules))) {
                    if (isScheduleKey(day)) tripData[day] = schedule;
                }
            } else {
                if (d1) tripData.day1 = JSON.parse(d1);
                if (d2) tripData.day2 = JSON.parse(d2);
                if (d3) tripData.day3 = JSON.parse(d3);
            }
            const details = JSON.parse(localStorage.getItem('yilan_trip_details') || '{}');
            tripData.title = details.title;
            tripData.dates = details.dates;
            tripData.dateRange = details.dateRange;
            tripData.reminder = details.reminder;
            tripData.stay = details.stay;
        }

                    item.name.toLowerCase().includes(keyword) || 
                    item.location.toLowerCase().includes(keyword) || 
                    item.tag.toLowerCase().includes(keyword) ||

        function getSchedule(day) {
            const val = tripData[day];
            if (Array.isArray(val)) {
                return { ids: val, notes: {} };
            }
            return val || { ids: [], notes: {} };
        }

        function isScheduleKey(key) {
            return /^(?:day[1-9][0-9]*|date-\d{4}-\d{2}-\d{2})$/.test(key);
        }

        function savedScheduleDays() {
            return Object.keys(tripData).filter(isScheduleKey);
        }

        function updateSchedule(day, newIds, newNotes) {
            if (!syncReady || syncConflict || !canEdit) return;
            tripData[day] = { ids: newIds, notes: newNotes };
            saveCloudData();
            renderAll();
        }

        // 將項目加入指定日期
        function addToSchedule(itemId, day) {
            if (!syncReady || syncConflict || !canEdit || !Object.hasOwn(dayLabels, day)) return;
            let dayObj = getSchedule(day);
            let ids = [...dayObj.ids];
            let notes = { ...dayObj.notes };
            if (!ids.includes(itemId)) {
                ids.push(itemId);
                updateSchedule(day, ids, notes);
                undoAddition = {itemId, day};
                document.getElementById('add-feedback-text').textContent = '已加入 ' + dayLabels[day];
                document.getElementById('add-feedback').hidden = false;
                clearTimeout(undoTimer);
                undoTimer = setTimeout(() => {
                    undoAddition = null;
                    document.getElementById('add-feedback').hidden = true;
                }, 6000);
            }
        }

        document.getElementById('undo-add').addEventListener('click', () => {
            if (undoAddition) removeFromSchedule(undoAddition.itemId, undoAddition.day);
            undoAddition = null;
            document.getElementById('add-feedback').hidden = true;
        });

        // 從行程中移除
        function removeFromSchedule(itemId, day) {
            if (!syncReady || syncConflict || !canEdit) return;
            let dayObj = getSchedule(day);
            let ids = dayObj.ids.filter(id => id !== itemId);
            let notes = { ...dayObj.notes };
            delete notes[itemId];
            updateSchedule(day, ids, notes);
        }

        // 更新項目備註
        function noteArrival(note) {
            const time = note.match(/^([01]?\d|2[0-3])[:：]([0-5]\d)(?!\d)/);
            return time ? time[1].padStart(2, '0') + ':' + time[2] : '';
        }

        function updateItemNote(itemId, day, noteText, input) {
            if (!syncReady || syncConflict || !canEdit || !getSchedule(day).ids.includes(itemId)) return;
            let dayObj = getSchedule(day);
            let ids = [...dayObj.ids];
            let notes = { ...dayObj.notes, [itemId]: noteText };
            tripData[day] = { ids, notes };
            const card = input?.closest('article');
            if (card) {
                const preview = card.querySelector('[data-note-preview]');
                preview.textContent = noteText;
                preview.hidden = !noteText;
                const badge = card.querySelector('[data-stop-time]');
                badge.textContent = noteArrival(noteText);
                badge.hidden = !badge.textContent;
            }
            saveCloudData();
        }

        // 行程上下移動排序
        function moveItem(index, direction, day) {
            if (!syncReady || syncConflict || !canEdit) return;
            const dayObj = getSchedule(day);
            const ids = [...dayObj.ids];
            const targetIndex = index + direction;
            if (index < 0 || index >= ids.length || targetIndex < 0 || targetIndex >= ids.length || index === targetIndex) return;
            const [id] = ids.splice(index, 1);
            ids.splice(targetIndex, 0, id);
            updateSchedule(day, ids, dayObj.notes);
        }

        function moveToDay(id, from, to, updatedNote) {
            if (!syncReady || syncConflict || !canEdit || !Object.hasOwn(dayLabels, to) || from === to) return;
            const source = getSchedule(from);
            const destination = getSchedule(to);
            if (!source.ids.includes(id) || destination.ids.includes(id)) return;
            const notes = {...source.notes};
            const note = updatedNote ?? notes[id];
            delete notes[id];
            tripData[from] = {ids: source.ids.filter(value => value !== id), notes};
            const nextNotes = {...destination.notes};
            if (note !== undefined) nextNotes[id] = note;
            updateSchedule(to, [...destination.ids, id], nextNotes);
        }

        // 重置所有行程
        function resetAllSchedules() {
            if (!isEditing || !syncReady || syncConflict || !canEdit) return;
            for (const day of savedScheduleDays()) tripData[day] = { ids: [], notes: {} };
            saveCloudData();
            renderAll();
        }

        const itinerarySizeObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(updateItineraryMinHeight) : null;

        function updateItineraryMinHeight() {
            const workspace = document.getElementById('trip-workspace');
            const list = document.getElementById('itinerary-list');
            const cards = Array.from(list.children).filter(card => card.tagName === 'ARTICLE').slice(0, 4);
            if (!list.getBoundingClientRect().width) return;

            const heights = cards.map(card => card.getBoundingClientRect().height);
            const referenceHeight = heights.length ? heights.reduce((sum, height) => sum + height, 0) / heights.length : 84;
            const gap = cards.length > 1
                ? cards[1].getBoundingClientRect().top - cards[0].getBoundingClientRect().bottom
                : 10;
            const minimumListHeight = [1, 1, 1, 0.5].reduce((total, weight, index) =>
                total + weight * (heights[index] ?? referenceHeight), 3 * gap);
            const itinerary = document.getElementById('trip-itinerary');
            const bottomPadding = parseFloat(getComputedStyle(itinerary).paddingBottom) +
                parseFloat(getComputedStyle(workspace).paddingBottom) + 1;
            const aboveList = list.getBoundingClientRect().top - workspace.getBoundingClientRect().top;
            workspace.style.setProperty('--itinerary-min-height', Math.ceil(aboveList + minimumListHeight + bottomPadding) + 'px');
        }

        function observeItinerarySize(list) {
            if (!itinerarySizeObserver) return;
            itinerarySizeObserver.disconnect();
            for (const id of ['trip-reminders', 'itinerary-toolbar']) {
                itinerarySizeObserver.observe(document.getElementById(id));
            }
            for (const card of Array.from(list.children).slice(0, 4)) itinerarySizeObserver.observe(card);
            updateItineraryMinHeight();
        }

        function bindStopReorder(handle, card, list, index, day) {
            let drag;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const updateDrag = (keepDragging = true) => {
                if (!drag?.lifted) return;
                if (!card.isConnected) {
                    finish({pointerId: drag.id}, false);
                    return;
                }
                const bounds = drag.scroller === list ? list.getBoundingClientRect() : {top: 64, bottom: window.innerHeight - 80};
                const edge = 44;
                const top = Math.max(64, bounds.top);
                const bottom = Math.min(window.innerHeight - 20, bounds.bottom);
                const delta = drag.y < top + edge ? -8 : drag.y > bottom - edge ? 8 : 0;
                if (keepDragging && delta) drag.scroller.scrollTop += delta;
                const offset = drag.y - drag.startY;
                drag.lifted.style.transform = 'translateY(' + offset + 'px) scale(' + (reducedMotion ? 1 : 1.025) + ')';
                const scrollChange = drag.scroller.scrollTop - drag.initialScroll;
                const center = drag.rect.top + drag.rect.height / 2 + offset + scrollChange;
                let destination = index;
                for (const stop of drag.stops) {
                    if (stop.index < index && center < stop.center) destination = Math.min(destination, stop.index);
                    if (stop.index > index && center > stop.center) destination = Math.max(destination, stop.index);
                }
                if (destination !== drag.destination) {
                    drag.destination = destination;
                    for (const stop of drag.stops) {
                        const shift = index < stop.index && stop.index <= destination ? -drag.slotHeight
                            : destination <= stop.index && stop.index < index ? drag.slotHeight : 0;
                        stop.element.style.setProperty('--reorder-shift', shift + 'px');
                    }
                }
                if (keepDragging) drag.frame = requestAnimationFrame(() => updateDrag());
            };
            const finish = (event, save) => {
                if (!drag || drag.id !== event.pointerId) return;
                if (save && drag.lifted && card.isConnected) {
                    drag.y = event.clientY;
                    updateDrag(false);
                }
                const finished = drag;
                drag = undefined;
                if (!finished.lifted) return;
                cancelAnimationFrame(finished.frame);
                const liftedRect = finished.lifted.getBoundingClientRect();
                finished.lifted.remove();
                for (const stop of finished.stops) stop.element.style.removeProperty('--reorder-shift');
                card.removeAttribute('data-dragging');
                if (!card.isConnected) return;
                const destination = save && syncReady && !syncConflict && canEdit ? finished.destination : index;
                if (destination !== index) moveItem(index, destination - index, day);
                const landed = list.querySelector('[data-stop-index="' + destination + '"]');
                if (landed && !reducedMotion && landed.animate) {
                    const top = landed.getBoundingClientRect().top;
                    landed.animate([
                        {transform: 'translateY(' + (liftedRect.top - top) + 'px) scale(1.025)'},
                        {transform: 'translateY(0) scale(1)'}
                    ], {duration: 180, easing: 'cubic-bezier(.2, .8, .25, 1)'});
                }
            };
            handle.addEventListener('pointerdown', event => {
                if (!event.isPrimary || event.button !== 0 || drag) return;
                drag = {id: event.pointerId, startY: event.clientY, y: event.clientY};
                handle.setPointerCapture(event.pointerId);
            });
            handle.addEventListener('pointermove', event => {
                if (!drag || drag.id !== event.pointerId) return;
                drag.y = event.clientY;
                if (drag.lifted || Math.abs(drag.y - drag.startY) < 5) return;
                drag.rect = card.getBoundingClientRect();
                drag.destination = index;
                drag.scroller = getComputedStyle(list).overflowY === 'auto' && list.scrollHeight > list.clientHeight
                    ? list : document.scrollingElement;
                drag.initialScroll = drag.scroller.scrollTop;
                const margin = parseFloat(getComputedStyle(card).marginTop) || 10;
                drag.slotHeight = drag.rect.height + margin;
                drag.stops = Array.from(list.querySelectorAll('[data-stop-index]'), element => {
                    const rect = element.getBoundingClientRect();
                    return {element, index: Number(element.dataset.stopIndex), center: rect.top + rect.height / 2};
                });
                const lifted = card.cloneNode(true);
                lifted.removeAttribute('data-stop-index');
                lifted.setAttribute('aria-hidden', 'true');
                lifted.inert = true;
                lifted.classList.add('reorder-lifted');
                lifted.classList.remove('relative');
                Object.assign(lifted.style, {left: drag.rect.left + 'px', top: drag.rect.top + 'px', width: drag.rect.width + 'px'});
                document.body.appendChild(lifted);
                drag.lifted = lifted;
                card.setAttribute('data-dragging', '');
                updateDrag();
            });
            handle.addEventListener('pointerup', event => finish(event, true));
            handle.addEventListener('pointercancel', event => finish(event, false));
            handle.addEventListener('lostpointercapture', event => finish(event, false));
            handle.addEventListener('keydown', event => {
                const direction = event.key === 'ArrowUp' ? -1 : event.key === 'ArrowDown' ? 1 : 0;
                if (!direction) return;
                event.preventDefault();
                moveItem(index, direction, day);
                list.querySelector('[data-stop-index="' + (index + direction) + '"] [data-reorder]')?.focus();
            });
        }

        // 渲染左側行程表
        function renderItinerary() {
            const container = document.getElementById('itinerary-list');
            const dayObj = getSchedule(currentDay);
            const scheduleIds = dayObj.ids;
            const notes = dayObj.notes || {};

            if (!container) return;
            container.innerHTML = '';

            if (scheduleIds.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-50 border border-dashed border-slate-200 rounded-[8px] p-8 text-center text-slate-400">
                        <i class="fa-solid fa-calendar-plus text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm">這天還沒有行程。到「探索」加入景點或美食。</p>
                    </div>
                `;
                observeItinerarySize(container);
                return;
            }

            scheduleIds.forEach((id, index) => {
                const rawItem = items.find(i => i.id === id);
                if (!rawItem) return;
                const item = displayItem(rawItem);
                const isRestaurant = item.type === 'restaurant';
                const currentNote = notes[id] || '';
                const arrivalTime = noteArrival(currentNote);
                const canChange = syncReady && canEdit && !syncConflict;
                const day = currentDay;
                const destinationDays = Object.keys(dayLabels).filter(other => other !== day && !getSchedule(other).ids.includes(id));

                const card = document.createElement('article');
                card.setAttribute('data-stop-index', String(index));
                card.className = "relative cursor-pointer bg-white/80 hover:bg-white border border-slate-200/80 rounded-[8px] p-4 transition shadow-xs";
                if (canChange && isEditing) card.classList.add('min-h-[88px]');
                
                const actionPadding = canChange ? 'pr-10' : '';
                card.innerHTML = `
                    <div class="flex items-start gap-2 ${actionPadding}">
                        <div class="min-w-0 ${canChange && isEditing ? 'pl-8' : ''}">
                            ${canChange && isEditing ? '<button type="button" data-reorder class="ui-control ui-small ui-square absolute left-[10px] top-1/2 grid -translate-y-1/2 cursor-grab place-items-center text-slate-500 active:cursor-grabbing" title="按住拖曳或用方向鍵排序" aria-label="調整站點順序"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>' : ''}
                            <div class="min-w-0 break-words">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-0.5 rounded-full ${isRestaurant ? 'bg-orange-50 text-orange-700 border border-orange-200' : 'bg-sky-50 text-sky-800 border border-[#accdde]'}">
                                        <i class="fa-solid ${isRestaurant ? 'fa-utensils' : 'fa-camera'}" aria-hidden="true"></i>${isRestaurant ? '美食' : '景點'}
                                    </span>
                                    ${item.tag ? `<span class="text-xs text-slate-500 font-medium">${item.tag}</span>` : ''}
                                </div>
                                <h4 class="text-base font-bold text-slate-800"><span data-stop-time ${arrivalTime ? '' : 'hidden'} class="mr-2 rounded-md bg-sky-50 px-2 py-0.5 text-sm text-sky-900">${arrivalTime}</span><button type="button" data-place-info aria-haspopup="dialog" class="break-words text-left hover:text-sky-700 hover:underline">${item.name}</button></h4>
                                ${item.highlight ? `<p class="text-xs text-rose-600 font-bold mt-1 bg-rose-50 px-2.5 py-1 rounded-md border border-rose-200 w-fit"><i class="fa-solid fa-clock mr-1"></i>${item.highlight}</p>` : ''}
                            </div>
                        </div>
                        ${canChange && isEditing ? `<button type="button" onclick="removeFromSchedule('${id}', '${day}')" class="ui-control ui-large ui-square absolute right-3 top-1/2 -translate-y-1/2 grid place-items-center hover:brightness-95 focus-visible:outline-rose-700" aria-label="從當日行程移除" title="從當日行程移除"><span class="stop-action-icon stop-action-remove" aria-hidden="true"><i class="fa-solid fa-trash-can"></i></span></button>` : ''}
                    </div>
                    <p data-note-preview ${currentNote ? '' : 'hidden'} class="mt-1 ${actionPadding} ${canChange && isEditing ? 'ml-8' : ''} whitespace-pre-wrap break-words text-sm text-slate-600">${escapeHtml(currentNote)}</p>
                    ${canChange && !isEditing ? `<details class="stop-editor text-slate-700">
                        <summary class="ui-control ui-large ui-square absolute right-3 top-1/2 -translate-y-1/2 grid list-none cursor-pointer place-items-center hover:brightness-95 focus-visible:outline-sky-700" aria-label="編輯行程項目" title="編輯行程項目"><span class="stop-action-icon stop-action-edit" aria-hidden="true"><i class="fa-solid fa-pen"></i><i class="fa-solid fa-check"></i></span></summary>
                        <form class="mt-1 grid gap-2 pr-11 text-xs">
                            <input data-stop-note type="text" aria-label="備註" placeholder="輸入備註" value="${escapeHtml(currentNote)}" class="ui-control ui-large block w-full border border-slate-200 px-3">
                            ${destinationDays.length ? `<select data-stop-day aria-label="移到其他天" class="ui-control ui-large w-full border border-slate-200 px-3">
                                <option value="">移到其他天</option>${destinationDays.map(other => `<option value="${other}">${dayLabels[other]}</option>`).join('')}
                            </select>` : ''}
                        </form>
                    </details>` : ''}
                `;
                container.appendChild(card);
                card.addEventListener('click', event => {
                    const control = event.target.closest('button, a, input, select, textarea, label, summary, .stop-editor');
                    if (!control || control.hasAttribute('data-place-info')) openPlaceInfo(id);
                });
                const editor = card.querySelector?.('.stop-editor');
                if (editor) {
                    const input = editor.querySelector('[data-stop-note]');
                    const destination = editor.querySelector('[data-stop-day]');
                    const summary = editor.querySelector('summary');
                    const form = editor.querySelector('form');
                    summary.addEventListener('click', event => {
                        if (!editor.open) return;
                        event.preventDefault();
                        form.requestSubmit();
                    });
                    editor.addEventListener('toggle', () => {
                        const label = editor.open ? '儲存行程項目' : '編輯行程項目';
                        summary.setAttribute('aria-label', label);
                        summary.title = label;
                        if (!editor.open) return;
                        input.value = getSchedule(day).notes[id] ?? '';
                        if (destination) destination.value = '';
                        input.focus({preventScroll: true});
                    });
                    form.addEventListener('submit', event => {
                        event.preventDefault();
                        if (!syncReady || syncConflict || !canEdit) return;
                        if (destination?.value) {
                            moveToDay(id, day, destination.value, input.value);
                            return;
                        }
                        if (input.value !== (getSchedule(day).notes[id] ?? '')) updateItemNote(id, day, input.value, input);
                        editor.open = false;
                        summary.focus({preventScroll: true});
                    });
                }
                const handle = card.querySelector?.('[data-reorder]');
                if (handle) bindStopReorder(handle, card, container, index, day);
            });
            observeItinerarySize(container);
        }

        // 渲染右側可用景點列表
        function renderItems(dataToRender) {
            const container = document.getElementById('items-container');
            if (!container) return;
            container.innerHTML = '';

            if (dataToRender.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-[8px] p-8 text-center text-slate-400 shadow-xs border border-slate-200">
                        <i class="fa-solid fa-face-meh text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm">沒有找到符合條件的項目</p>
                    </div>
                `;
                return;
            }

            dataToRender.forEach(rawItem => {
                const item = displayItem(rawItem);
                const isRestaurant = item.type === 'restaurant';
                const inCurrentDay = getSchedule(currentDay).ids.includes(item.id);
                const canChange = syncReady && canEdit && !syncConflict;
                const alternateDays = Object.keys(dayLabels).filter(day => day !== currentDay && !getSchedule(day).ids.includes(item.id));
                const lines = item.desc.split(/<br\s*\/?>/i).map(line => line.replace(/<[^>]*>/g, '').trim()).filter(Boolean);
                const hours = lines.find(line => /^(營業|開放)時間[：:]/.test(line));
                const feature = (lines.find(line => line !== hours) || '').replace(/^網友推薦[：:]/, '').split('。')[0];

                const card = document.createElement('div');
                card.className = "bg-white rounded-[8px] p-5 shadow-xs border border-slate-200 hover:border-[#0284c7] transition duration-200";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-4">
                        <div class="min-w-0 space-y-2">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-0.5 rounded-full ${isRestaurant ? 'bg-orange-50 text-orange-700 border border-orange-200' : 'bg-sky-50 text-sky-800 border border-[#accdde]'}">
                                    <i class="fa-solid ${isRestaurant ? 'fa-utensils' : 'fa-camera'}" aria-hidden="true"></i>${isRestaurant ? '美食' : '景點'}
                                </span>
                                ${item.tag ? `<span class="text-xs text-slate-500 font-medium">${item.tag}</span>` : ''}
                            </div>
                            <h3 class="break-words text-lg font-bold text-slate-800">${item.name}</h3>
                            ${feature ? `<p class="line-clamp-2 text-sm text-slate-700">${feature}</p>` : ''}
                            ${hours ? `<p class="text-xs text-slate-500">${hours}</p>` : ''}
                            ${item.highlight ? `<p class="text-xs font-semibold text-rose-700">${item.highlight}</p>` : ''}
                        </div>

                        <div class="flex flex-col items-stretch gap-2 shrink-0">
                            <a href="${item.mapUrl}" target="_blank" class="ui-control ui-large place-map bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 font-medium transition flex items-center gap-1 border border-slate-200">
                                <i class="fa-solid fa-diamond-turn-right text-slate-500"></i> 地圖
                            </a>
                            ${canChange ? `<button type="button" onclick="openPlaceForm('${item.id}')" class="ui-control ui-large inline-flex items-center justify-center text-sky-700 hover:bg-sky-50 border border-sky-200 px-3"><i class="fa-solid fa-pen mr-1" aria-hidden="true"></i>編輯</button>` : ''}
                            
                        </div>
                    </div>
                    <div class="mt-3 border-t border-slate-100 pt-3">
                        <div class="inline-grid max-w-full grid-flow-col auto-cols-fr items-center gap-2">
                            <button type="button" onclick="addToSchedule('${item.id}', '${currentDay}')" ${!canChange || inCurrentDay ? 'disabled' : ''} class="ui-control ui-small min-w-0 bg-sky-700 px-3 font-bold text-white hover:bg-sky-800 disabled:bg-slate-100 disabled:text-slate-600">
                                ${inCurrentDay ? '✓ 已加入 ' : '＋加入 '}${dayLabels[currentDay]}
                            </button>
                            ${canChange && alternateDays.length ? `<select aria-label="加入其他日期" onchange="addToSchedule('${item.id}', this.value)" class="ui-control ui-small min-w-0 border border-slate-200 bg-white px-2 text-slate-700">
                                <option value="">其他日期</option>
                                ${alternateDays.map(day => `<option value="${day}">加入 ${dayLabels[day]}</option>`).join('')}
                            </select>` : ''}
                        </div>
                    </div>
                    <details class="mt-2 text-sm text-slate-600">
                        <summary class="cursor-pointer py-1 text-xs font-semibold text-sky-800">完整介紹</summary>
                        <p class="mt-1 text-xs text-slate-500">${item.location}</p>
                        <div class="mt-2 leading-relaxed">${item.desc}</div>
                    </details>
                `;
                container.appendChild(card);
            });
        }

        function filterItems(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            btn.classList.add("bg-slate-100", "hover:bg-slate-200", "text-slate-600");
            });
            const activeBtn = document.getElementById(`filter-${type}`);
            if (activeBtn) {
                activeBtn.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            activeBtn.classList.add("bg-[#0284c7]", "text-white", "shadow-sm");
            }
            applyFilterAndSearch();
        }

        // 綁定全域函式供 HTML onclick 使用
        window.toggleItineraryEdit = toggleItineraryEdit;
        window.switchDay = switchDay;
        window.switchTripView = switchTripView;
        window.searchItems = searchItems;
        window.filterItems = filterItems;
        window.addToSchedule = addToSchedule;
        window.removeFromSchedule = removeFromSchedule;
        window.updateItemNote = updateItemNote;
        window.moveItem = moveItem;
        window.moveToDay = moveToDay;
        window.resetAllSchedules = resetAllSchedules;

        // 頁面載入時初始化 Firebase
        window.onload = function() {
            const header = document.querySelector('.page-header');
            const placesPane = document.getElementById('trip-places');
            const placesHeading = placesPane.querySelector('.places-heading');
            const placesMarker = document.getElementById('places-sticky-marker');
            const dateMarker = document.getElementById('trip-date-marker');
            const dateRow = document.getElementById('trip-date-row');
            let stickyObserver;
            const updateStickyOffsets = () => {
                const height = header.offsetHeight;
                placesPane.style.setProperty('--places-sticky-top', height + 'px');
                dateRow.style.setProperty('--trip-date-sticky-top', height + 'px');
                stickyObserver?.disconnect();
                if (typeof IntersectionObserver !== 'function') return;
                stickyObserver = new IntersectionObserver(entries => {
                    for (const entry of entries) {
                        const element = entry.target === dateMarker ? dateRow : placesHeading;
                        element.classList.toggle('is-stuck', !entry.isIntersecting && entry.boundingClientRect.bottom <= height);
                    }
                }, {rootMargin: '-' + height + 'px 0px 0px 0px'});
                stickyObserver.observe(placesMarker);
                stickyObserver.observe(dateMarker);
            };
            updateStickyOffsets();
            if (typeof ResizeObserver === 'function') new ResizeObserver(updateStickyOffsets).observe(header);
            initFirebase();
        };
    </script>
</body>
</html>
