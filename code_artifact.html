        }
        @media (min-width: 640px) {

            }
        }
        .mobile-nav {

        }
        @media (width < 1024px) {
            footer.trip-footer {
                padding-bottom: calc(96px + env(safe-area-inset-bottom));
            }
            .page-header {
                padding-top: env(safe-area-inset-top);
            }
            .mobile-nav-target {
                scroll-margin-top: calc(5.5rem + env(safe-area-inset-top));
            }
            .mobile-nav {
                position: fixed;
                bottom: calc(12px + env(safe-area-inset-bottom));
                left: max(14px, env(safe-area-inset-left));
                right: max(14px, env(safe-area-inset-right));
                max-width: 480px;
                margin-inline: auto;
                z-index: 40;
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 4px;
                padding: 6px;
                background: #fff;
                border: 1px solid rgb(10 80 123 / 19%);
                border-radius: 999px;
                box-shadow: 0 7px 22px rgb(10 80 123 / 15%), inset 0 1px 0 rgb(255 255 255 / 90%);
            }
            .mobile-nav a {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 5px;
                min-height: 54px;
                padding: 4px 2px;
                border-radius: 999px;
                color: #0a507b;
                font-size: .75rem;
                font-weight: 700;
                line-height: 1.25;
                text-decoration: none;
            }
            .mobile-nav i {
                font-size: 1rem;
            }
            .mobile-nav::before {
                content: "";
                position: absolute;
                inset: 6px auto 6px 6px;
                width: calc((100% - 24px) / 4);
                border-radius: 999px;
                background: rgb(10 80 123 / 12%);
                pointer-events: none;
                transform: translateX(calc(var(--selected-nav-index, 0) * (100% + 4px)));
                transition: transform 280ms cubic-bezier(.22, .8, .3, 1);
            }
            body:has(#trip-stay:target) .mobile-nav {
                --selected-nav-index: 1;
            }
            body:has(#trip-itinerary:target) .mobile-nav {
                --selected-nav-index: 2;
            }
            body:has(#trip-places:target) .mobile-nav {
                --selected-nav-index: 3;
            }
            .mobile-nav a:focus-visible {
                outline: 2px solid #0284c7;
                outline-offset: -2px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .mobile-nav::before {
                transition: none;
            }
        }
        @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            @media (width < 1024px) {
                .mobile-nav {
                    background: rgb(255 255 255 / 78%);
                    -webkit-backdrop-filter: blur(18px) saturate(135%);

                }
            }
        }
        @media (prefers-reduced-transparency: reduce) {
            .mobile-nav {
                background: #fff;
                -webkit-backdrop-filter: none;
                backdrop-filter: none;
            }

        }
        async function fetchCloud() {
            if (sheetsEndpoint) return requestSheets('read');
            const r = await fetch('/api/itinerary', { cache: 'no-store' });
            if (!r.ok) throw Error('Cloud unavailable');
            return r.json();
        }
        async function requestSheets(action, payload = {}) {
            const response = await fetch(sheetsEndpoint, {
                method: 'POST',
                headers: {'Content-Type': 'text/plain;charset=UTF-8'},
                body: JSON.stringify({action, ...payload})
            });
            if (!response.ok) throw Error('storage_unavailable');
            const data = await response.json();
            if (data.error) throw Error(data.error);
            if (!Number.isSafeInteger(data.revision)) throw Error('storage_unavailable');
            return data;
        }
        async function initFirebase() {
            if (useBrowserStorage) {
                canEdit = syncReady = true;
                try {
                    loadFromLocalStorage();
                    updateSyncStatus('使用此瀏覽器儲存', 'text-sky-200', 'fa-floppy-disk');
                } catch {
                    updateSyncStatus('無法讀取瀏覽器中的行程', 'text-rose-300', 'fa-circle-exclamation');
                }
                renderAll();
                return;
            }
            try {
                const data = await fetchCloud();
                canEdit = data.canEdit;
                cloudRevision = data.revision;
                if (data.tripData) tripData = data.tripData;
                else if (canEdit && !sheetsEndpoint) {
                    loadFromLocalStorage();
                    pendingSave = ['day1','day2','day3'].some(day => getSchedule(day).ids.length) || !!tripData.customItems?.length || !!tripData.deletedItemIds?.length;
                }
                syncReady = true;
                renderAll();
                if (pendingSave) await saveCloudData();
                else updateSyncStatus('\u96f2\u7aef\u5df2\u540c\u6b65', 'text-emerald-300');
            } catch {
                updateSyncStatus('連線失敗，請重新整理', 'text-rose-300');
                renderAll();
            }
        }
        async function saveCloudData() {
            const savedLocally = saveToLocalStorage();
            if (useBrowserStorage) {
                if (savedLocally) updateSyncStatus('已儲存在此瀏覽器', 'text-emerald-300', 'fa-floppy-disk');
                else updateSyncStatus('瀏覽器儲存失敗', 'text-rose-300', 'fa-circle-exclamation');
                return;
            }
            pendingSave = true;
            if (saving || syncConflict || !syncReady) return;
            saving = true;
            try {
                while (pendingSave) {
                    pendingSave = false;
                    updateSyncStatus('\u5132\u5b58\u4e2d\u2026');
                    const payload = {tripData, revision: cloudRevision};
                    if (sheetsEndpoint) {
                        cloudRevision = (await requestSheets('save', payload)).revision;
                    } else {
                        const r = await fetch('/api/itinerary', {method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)});
                        if (r.status === 409) throw Error('conflict');
                        if (!r.ok) throw Error('Save failed');
                        cloudRevision = (await r.json()).revision;
                    }
                }
                updateSyncStatus('\u96f2\u7aef\u5df2\u540c\u6b65', 'text-emerald-300');
            } catch (error) {
                syncConflict = error.message === 'conflict';
                pendingSave = true;
                updateSyncStatus(syncConflict ? '\u7248\u672c\u885d\u7a81\uff0c\u8acb\u91cd\u65b0\u6574\u7406' : '\u5c1a\u672a\u540c\u6b65\uff0c\u9023\u7dda\u5f8c\u81ea\u52d5\u91cd\u8a66', 'text-rose-300');
            } finally { saving = false; }
        }
        setInterval(async () => {
            if (useBrowserStorage || !syncReady || saving || syncConflict) return;
            if (pendingSave) { saveCloudData(); return; }
            if (isEditing || detailsDialog.open || document.hidden || document.getElementById('place-dialog').open) return;
            try {
                const data = await fetchCloud();
                if (pendingSave || saving || isEditing || detailsDialog.open || document.getElementById('place-dialog').open) return;
                if (data.revision !== cloudRevision) {
                    cloudRevision = data.revision;
                    if (data.tripData) tripData = data.tripData;
                    renderAll();
                }
                updateSyncStatus('\u96f2\u7aef\u5df2\u540c\u6b65', 'text-emerald-300');
            } catch { updateSyncStatus('\u9023\u7dda\u4e2d\u65b7\uff0c\u6b63\u5728\u91cd\u8a66', 'text-amber-300'); }
        }, 5000);
        window.addEventListener('beforeunload', event => {
            if (pendingSave || saving) { event.preventDefault(); event.returnValue = ''; }
        });

        function saveToLocalStorage() {
            try {
                localStorage.setItem('yilan_places', JSON.stringify({customItems:tripData.customItems || [], deletedItemIds:tripData.deletedItemIds || []}));
                localStorage.setItem('yilan_schedule_day1', JSON.stringify(tripData.day1));
                localStorage.setItem('yilan_schedule_day2', JSON.stringify(tripData.day2));
                localStorage.setItem('yilan_schedule_day3', JSON.stringify(tripData.day3));
                localStorage.setItem('yilan_trip_details', JSON.stringify({reminder: tripData.reminder, stay: tripData.stay}));
                return true;
            } catch { return false; }
        }

        function loadFromLocalStorage() {
            const places = JSON.parse(localStorage.getItem('yilan_places') || '{}');
            tripData.customItems = places.customItems || [];
            tripData.deletedItemIds = places.deletedItemIds || [];
            const d1 = localStorage.getItem('yilan_schedule_day1');
            const d2 = localStorage.getItem('yilan_schedule_day2');
            const d3 = localStorage.getItem('yilan_schedule_day3');
            if (d1) tripData.day1 = JSON.parse(d1);
            if (d2) tripData.day2 = JSON.parse(d2);
            if (d3) tripData.day3 = JSON.parse(d3);
            const details = JSON.parse(localStorage.getItem('yilan_trip_details') || '{}');
            tripData.reminder = details.reminder;
            tripData.stay = details.stay;
        }


        function renderAll() {
            renderTripDetails();
            rebuildItems();
            document.getElementById('add-place').disabled = !syncReady || syncConflict;
            const editButton = document.getElementById('edit-itinerary');
            editButton.disabled = !syncReady || syncConflict;
            editButton.setAttribute('aria-pressed', String(isEditing));
            editButton.innerHTML = isEditing
                ? '<i class="fa-solid fa-check mr-1.5" aria-hidden="true"></i> 完成'
                : '<i class="fa-solid fa-pen mr-1.5" aria-hidden="true"></i> 編輯';
            if (!canEdit) editButton.innerHTML = '\u767b\u5165\u7de8\u8f2f';
            const resetButton = document.getElementById('reset-schedules');
            resetButton.disabled = !isEditing;
            resetButton.hidden = !isEditing;
            resetButton.classList.toggle('hidden', !isEditing);
            renderItinerary();
            applyFilterAndSearch();
            const totalCount = items.length;
            const countEl = document.getElementById('total-count');
            if (countEl) countEl.innerText = totalCount;
        }

        // 搜尋與篩選整合處理
        function searchItems() {
            applyFilterAndSearch();
        }

        function applyFilterAndSearch() {
            const searchInput = document.getElementById('search-input');
            const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

            let filtered = items.filter(item => {
                const matchesType = (currentFilter === 'all') || (item.type === currentFilter);
                const matchesKeyword = !keyword || 
                    item.name.toLowerCase().includes(keyword) || 
                    item.location.toLowerCase().includes(keyword) || 
                    item.tag.toLowerCase().includes(keyword) || 
                    item.desc.toLowerCase().includes(keyword);
                return matchesType && matchesKeyword;
            });

            renderItems(filtered);
        }

        // 切換日期分頁
        function switchDay(day) {
            currentDay = day;
            const btn1 = document.getElementById('tab-day1');
            const btn2 = document.getElementById('tab-day2');
            const btn3 = document.getElementById('tab-day3');
            const title = document.getElementById('current-day-title');

            if (!btn1 || !btn2 || !btn3) return;

            btn1.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            btn1.classList.add("text-slate-500", "hover:text-slate-800");
            btn2.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            btn2.classList.add("text-slate-500", "hover:text-slate-800");
            btn3.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            btn3.classList.add("text-slate-500", "hover:text-slate-800");

            if (day === 'day1') {
                btn1.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            btn1.classList.add("bg-[#0284c7]", "text-white", "shadow-sm");
                title.innerText = "2026/12/12 (星期六) 行程";
            } else if (day === 'day2') {
                btn2.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            btn2.classList.add("bg-[#0284c7]", "text-white", "shadow-sm");
                title.innerText = "2026/12/13 (星期日) 行程";
            } else {
                btn3.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            btn3.classList.add("bg-[#0284c7]", "text-white", "shadow-sm");
                title.innerText = "2026/12/14 (星期一) 行程";
            }
            renderItinerary();
        }

        function toggleItineraryEdit() {
            if (!syncReady || syncConflict) return;
            if (!canEdit) { window.location.href = '/signin-with-chatgpt?return_to=%2F'; return; }
            isEditing = !isEditing;
            renderAll();
        }

        function getSchedule(day) {
            const val = tripData[day];
            if (Array.isArray(val)) {
                return { ids: val, notes: {} };
            }
            return val || { ids: [], notes: {} };
        }

        function updateSchedule(day, newIds, newNotes) {
            if (!isEditing || !syncReady || syncConflict || !canEdit) return;
            tripData[day] = { ids: newIds, notes: newNotes };
            saveCloudData();
            renderAll();
        }

        // 將項目加入指定日期
        function addToSchedule(itemId, day) {
            if (!isEditing || !syncReady || syncConflict || !canEdit) return;
            let dayObj = getSchedule(day);
            let ids = [...dayObj.ids];
            let notes = { ...dayObj.notes };
            if (!ids.includes(itemId)) {
                ids.push(itemId);
                updateSchedule(day, ids, notes);
            }
        }

        // 從行程中移除
        function removeFromSchedule(itemId, day) {
            if (!isEditing || !syncReady || syncConflict || !canEdit) return;
            let dayObj = getSchedule(day);
            let ids = dayObj.ids.filter(id => id !== itemId);
            let notes = { ...dayObj.notes };
            delete notes[itemId];
            updateSchedule(day, ids, notes);
        }

        // 更新項目備註
        function updateItemNote(itemId, day, noteText) {
            if (!isEditing || !syncReady || syncConflict || !canEdit) return;
            let dayObj = getSchedule(day);
            let ids = [...dayObj.ids];
            let notes = { ...dayObj.notes, [itemId]: noteText };
            tripData[day] = { ids, notes };
            saveCloudData();
        }

        // 行程上下移動排序
        function moveItem(index, direction, day) {
            if (!isEditing || !syncReady || syncConflict || !canEdit) return;
            let dayObj = getSchedule(day);
            let ids = [...dayObj.ids];
            let notes = { ...dayObj.notes };
            
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= ids.length) return;
            
            const temp = ids[index];
            ids[index] = ids[targetIndex];
            ids[targetIndex] = temp;
            
            updateSchedule(day, ids, notes);
        }

        // 重置所有行程
        function resetAllSchedules() {
            if (!isEditing || !syncReady || syncConflict || !canEdit) return;
            tripData.day1 = { ids: [], notes: {} };
            tripData.day2 = { ids: [], notes: {} };
            tripData.day3 = { ids: [], notes: {} };
            saveCloudData();
            renderAll();
        }

        // 渲染左側行程表
        function renderItinerary() {
            const container = document.getElementById('itinerary-list');
            const dayObj = getSchedule(currentDay);
            const scheduleIds = dayObj.ids;
            const notes = dayObj.notes || {};

            if (!container) return;
            container.innerHTML = '';

            const countText = document.getElementById('current-day-count');
            if (countText) countText.innerText = `已排入 ${scheduleIds.length} 個站點`;

            if (scheduleIds.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-50 border border-dashed border-slate-200 rounded-2xl p-8 text-center text-slate-400">
                        <i class="fa-solid fa-calendar-plus text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm">此日尚無行程，請從右側點擊加入此日行程！</p>
                    </div>
                `;
                return;
            }

            scheduleIds.forEach((id, index) => {
                const rawItem = items.find(i => i.id === id);
                if (!rawItem) return;
                const item = displayItem(rawItem);
                const isRestaurant = item.type === 'restaurant';
                const currentNote = notes[id] || '';

                const card = document.createElement('div');
                card.className = "bg-white/80 hover:bg-white border border-slate-200/80 rounded-xl p-4 transition flex flex-col gap-2.5 shadow-xs";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-start gap-3">
                            <div class="bg-[#0284c7] text-white font-bold text-sm w-7 h-7 rounded-lg flex items-center justify-center shrink-0 mt-0.5 shadow-xs">
                                ${index + 1}
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${isRestaurant ? 'bg-orange-50 text-orange-700 border border-orange-200' : 'bg-sky-50 text-sky-800'}">
                                        ${isRestaurant ? '美食' : '景點'}
                                    </span>
                                    <span class="text-xs text-slate-500 font-medium">${item.tag}</span>
                                </div>
                                <h4 class="text-base font-bold text-slate-800">${item.name}</h4>
                                ${item.highlight ? `<p class="text-xs text-rose-600 font-bold mt-1 bg-rose-50 px-2.5 py-1 rounded-md border border-rose-200 w-fit"><i class="fa-solid fa-clock mr-1"></i>${item.highlight}</p>` : ''}
                            </div>
                        </div>
                        <div class="${isEditing ? 'flex' : 'hidden'} items-center gap-1 shrink-0">
                            <div class="flex flex-col gap-0.5">
                                <button onclick="moveItem(${index}, -1, '${currentDay}')" ${index === 0 ? 'disabled class="text-slate-300 cursor-not-allowed text-sm p-1"' : 'class="text-slate-400 hover:text-[#0284c7] text-sm p-1 transition"'} title="往上移">
                                    <i class="fa-solid fa-chevron-up"></i>
                                </button>
                                <button onclick="moveItem(${index}, 1, '${currentDay}')" ${index === scheduleIds.length - 1 ? 'disabled class="text-slate-300 cursor-not-allowed text-sm p-1"' : 'class="text-slate-400 hover:text-[#0284c7] text-sm p-1 transition"'} title="往下移">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </button>
                            </div>
                            <button onclick="removeFromSchedule('${id}', '${currentDay}')" class="text-slate-400 hover:text-rose-500 p-1.5 transition text-sm" title="從此日移除">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <!-- 即時備註輸入框 -->
                    <div class="mt-1">
                        <input ${isEditing ? '' : 'readonly'} type="text" value="${currentNote.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;')}" oninput="updateItemNote('${id}', '${currentDay}', this.value)" placeholder="輸入自訂備註（例如：11:30 抵達、預約保留中）..." class="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#0284c7] text-slate-600">
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 渲染右側可用景點列表
        function renderItems(dataToRender) {
            const container = document.getElementById('items-container');
            if (!container) return;
            container.innerHTML = '';

            if (dataToRender.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center text-slate-400 shadow-xs border border-slate-200">
                        <i class="fa-solid fa-face-meh text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm">沒有找到符合條件的項目</p>
                    </div>
                `;
                return;
            }

            dataToRender.forEach(rawItem => {
                const item = displayItem(rawItem);
                const isRestaurant = item.type === 'restaurant';
                const inDay1 = getSchedule('day1').ids.includes(item.id);
                const inDay2 = getSchedule('day2').ids.includes(item.id);
                const inDay3 = getSchedule('day3').ids.includes(item.id);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-5 shadow-xs border border-slate-200 hover:border-[#0284c7] transition duration-200";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-4">
                        <div class="space-y-2">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-xs font-semibold px-3 py-1 rounded-full ${isRestaurant ? 'bg-orange-50 text-orange-700 border border-orange-200' : 'bg-sky-50 text-sky-700 border border-sky-200'}">
                                    ${isRestaurant ? '<i class="fa-solid fa-utensils mr-1"></i>餐廳美食' : '<i class="fa-solid fa-camera mr-1"></i>觀光景點'}
                                </span>
                                <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-medium"><i class="fa-solid fa-location-dot text-[#0284c7] mr-1"></i>${item.tag}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800">${item.name}</h3>
                            <p class="text-sm text-slate-500"><i class="fa-regular fa-map mr-1"></i>${item.location}</p>
                            
                            ${item.highlight ? `<div class="bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 w-fit"><i class="fa-solid fa-calendar-check text-rose-500"></i>${item.highlight}</div>` : ''}
                            
                            <div class="text-sm text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                                ${item.desc}
                            </div>
                        </div>

                        <div class="flex flex-col items-end gap-2 shrink-0">
                            <a href="${item.mapUrl}" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl font-medium transition flex items-center gap-1 border border-slate-200">
                                <i class="fa-solid fa-diamond-turn-right text-slate-500"></i> 地圖
                            </a>
                            ${isEditing && canEdit ? `<button type="button" onclick="deletePlace('${item.id}')" class="text-rose-600 hover:bg-rose-50 border border-rose-200 text-xs px-3 py-2 rounded-xl"><i class="fa-solid fa-trash-can mr-1" aria-hidden="true"></i>刪除</button>` : ''}
                            ${canEdit && item.id.startsWith('custom-') ? `<button type="button" onclick="openPlaceForm('${item.id}')" ${(!syncReady || syncConflict) ? 'disabled' : ''} class="text-sky-700 hover:bg-sky-50 border border-sky-200 text-xs px-3 py-2 rounded-xl disabled:opacity-50"><i class="fa-solid fa-pen mr-1" aria-hidden="true"></i>編輯</button>` : ''}
                            
                            <!-- 三日加入行程按鈕 -->
                            <div class="flex flex-col gap-1.5 mt-1">
                                <button onclick="addToSchedule('${item.id}', 'day1')" ${(!isEditing || !canEdit || inDay1) ? 'disabled class="bg-slate-100 text-slate-400 cursor-default text-xs px-3 py-1.5 rounded-lg font-medium"' : 'class="bg-[#0284c7] hover:bg-[#0369a1] text-white text-xs px-3.5 py-1.5 rounded-lg transition font-medium shadow-xs"'}>
                                    ${inDay1 ? '<i class="fa-solid fa-check mr-1"></i>已在 12/12' : '+ 12/12'}
                                </button>
                                <button onclick="addToSchedule('${item.id}', 'day2')" ${(!isEditing || !canEdit || inDay2) ? 'disabled class="bg-slate-100 text-slate-400 cursor-default text-xs px-3 py-1.5 rounded-lg font-medium"' : 'class="bg-[#0284c7] hover:bg-[#0369a1] text-white text-xs px-3.5 py-1.5 rounded-lg transition font-medium shadow-xs"'}>
                                    ${inDay2 ? '<i class="fa-solid fa-check mr-1"></i>已在 12/13' : '+ 12/13'}
                                </button>
                                <button onclick="addToSchedule('${item.id}', 'day3')" ${(!isEditing || !canEdit || inDay3) ? 'disabled class="bg-slate-100 text-slate-400 cursor-default text-xs px-3 py-1.5 rounded-lg font-medium"' : 'class="bg-[#38bdf8] hover:bg-[#0284c7] text-white text-xs px-3.5 py-1.5 rounded-lg transition font-medium shadow-xs"'}>
                                    ${inDay3 ? '<i class="fa-solid fa-check mr-1"></i>已在 12/14' : '+ 12/14'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterItems(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            btn.classList.add("bg-slate-100", "hover:bg-slate-200", "text-slate-600");
            });
            const activeBtn = document.getElementById(`filter-${type}`);
            if (activeBtn) {
                activeBtn.classList.remove("bg-[#0284c7]", "bg-slate-100", "text-white", "text-slate-500", "text-slate-600", "hover:text-slate-800", "hover:bg-slate-200", "shadow-xs", "shadow-sm");
            activeBtn.classList.add("bg-[#0284c7]", "text-white", "shadow-sm");
            }
            applyFilterAndSearch();
        }

        // 綁定全域函式供 HTML onclick 使用
        window.toggleItineraryEdit = toggleItineraryEdit;
        window.switchDay = switchDay;
        window.searchItems = searchItems;
        window.filterItems = filterItems;
        window.addToSchedule = addToSchedule;
        window.removeFromSchedule = removeFromSchedule;
        window.updateItemNote = updateItemNote;
        window.moveItem = moveItem;
        window.resetAllSchedules = resetAllSchedules;

        // 頁面載入時初始化 Firebase
        window.onload = function() {
            initFirebase();
        };
    </script>
</body>
</html>
