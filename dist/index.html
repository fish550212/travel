<body class="bg-slate-50 text-slate-700 min-h-screen flex flex-col">

                </span>
                <button id="reset-schedules" disabled hidden onclick="resetAllSchedules()" class="bg-white/10 hover:bg-white/20 text-sm px-3.5 py-2 rounded-lg transition border border-white/20 flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> 重置行程

            </div>
        </div>
    </header>

    <!-- 主要內容區：採用左右排版 -->

                </p>
            </div>

                </div>

                <!-- 行程站點清單 -->

                    <!-- 動態載入 -->
                </div>

        </div>

        <!-- 右側：可用景點與美食資料庫 (7欄) -->

                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="searchItems()" placeholder="搜尋景點、美食或地區..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#0284c7] text-sm">
                </div>

                <!-- 分類篩選 -->

            </div>
        </div>

    </main>

    <!-- 頁尾 -->

        <div class="max-w-7xl mx-auto px-4 space-y-1">

    <!-- JavaScript 邏輯 -->

                mapUrl: 'https://www.google.com/maps/place/?q=place_id:ChIJHYobiaHpZzQRJ-WUexwBCY4'
            },
            {

                type: 'attraction',
                name: '拳頭姆自然步道',
                location: '宜蘭縣三星鄉台7丙線9.5公里處',
                tag: '三星鄉',
                desc: '步道全長約 1.3 公里，坡度平緩好走。沿途為美麗烏心石造林地與豐富蕨類生態，設有觀景平台可眺望蘭陽平原。',
                mapUrl: 'https://www.google.com/maps/place/?q=place_id:ChIJVfHJCJcKaDQR8y1rWQdanwU'
            },
            {
                id: 'spot-6',
                type: 'attraction',
                name: '清水地熱公園',
                location: '宜蘭縣大同鄉清水路82-1號',
                tag: '大同鄉',
                desc: '<strong>營業時間：</strong>週一至週日 09:00 – 17:00<br>超人氣溫泉煮食與免費泡腳樂園。可租借竹籠煮玉米、雞蛋，並享受足湯樂趣。',
                mapUrl: 'https://www.google.com/maps/place/?q=place_id:ChIJuX8uLwMaZzQRd0B_n_n_n_c'
            }
        ];

        let currentDay = 'day1'; // 'day1', 'day2' 或 'day3'
        let currentFilter = 'all';
        let isEditing = false;
        let tripData = {
            day1: { ids: [], notes: {} },
            day2: { ids: [], notes: {} },
            day3: { ids: [], notes: {} }
        };

        // 初始化 Firebase 與身分驗證

        function updateSyncStatus(text, color = 'text-sky-200', icon = 'fa-cloud') {
            const el = document.getElementById('cloud-sync-status');
            if (el) el.innerHTML = `<i class="fa-solid ${icon} ${color}"></i> <span>${text}</span>`;
        }
        async function fetchCloud() {
            const r = await fetch('/api/itinerary', { cache: 'no-store' });
            if (!r.ok) throw Error('Cloud unavailable');
            return r.json();
        }
        async function initFirebase() {
            try {
                const data = await fetchCloud();
                cloudRevision = data.revision;
                if (data.tripData) tripData = data.tripData;
                else {
                    loadFromLocalStorage();
                    pendingSave = Object.values(tripData).some(day => (day.ids || day).length);
                }
                isCloudSynced = syncReady = true;
                renderAll();
                if (pendingSave) await saveCloudData();
                else updateSyncStatus('\u96f2\u7aef\u5df2\u540c\u6b65', 'text-emerald-300');
            } catch {
                updateSyncStatus('\u9023\u7dda\u5931\u6557\uff0c\u8acb\u91cd\u65b0\u6574\u7406', 'text-rose-300');
                renderAll();
            }
        }
        async function saveCloudData() {
            pendingSave = true;
            saveToLocalStorage();
            if (saving || syncConflict || !syncReady) return;
            saving = true;
            try {
                while (pendingSave) {
                    pendingSave = false;
                    updateSyncStatus('\u5132\u5b58\u4e2d\u2026');
                    const r = await fetch('/api/itinerary', {method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({tripData, revision:cloudRevision})});
                    if (r.status === 409) { syncConflict = true; throw Error('Conflict'); }
                    if (!r.ok) throw Error('Save failed');
                    cloudRevision = (await r.json()).revision;
                }
                updateSyncStatus('\u96f2\u7aef\u5df2\u540c\u6b65', 'text-emerald-300');
            } catch {
                pendingSave = true;
                updateSyncStatus(syncConflict ? '\u7248\u672c\u885d\u7a81\uff0c\u8acb\u91cd\u65b0\u6574\u7406' : '\u5c1a\u672a\u540c\u6b65\uff0c\u9023\u7dda\u5f8c\u81ea\u52d5\u91cd\u8a66', 'text-rose-300');
            } finally { saving = false; }
        }
        setInterval(async () => {
            if (!syncReady || saving || syncConflict) return;
            if (pendingSave) { saveCloudData(); return; }
            if (isEditing || document.hidden) return;
            try {
                const data = await fetchCloud();
                if (pendingSave || saving || isEditing) return;
                if (data.revision !== cloudRevision) {
                    cloudRevision = data.revision;
                    if (data.tripData) tripData = data.tripData;
                    renderAll();
                }
                updateSyncStatus('\u96f2\u7aef\u5df2\u540c\u6b65', 'text-emerald-300');
            } catch { updateSyncStatus('\u9023\u7dda\u4e2d\u65b7\uff0c\u6b63\u5728\u91cd\u8a66', 'text-amber-300'); }
        }, 5000);
        window.addEventListener('beforeunload', event => {
            if (pendingSave || saving) { event.preventDefault(); event.returnValue = ''; }
        });

        function saveToLocalStorage() {
            localStorage.setItem('yilan_schedule_day1', JSON.stringify(tripData.day1));
            localStorage.setItem('yilan_schedule_day2', JSON.stringify(tripData.day2));
            localStorage.setItem('yilan_schedule_day3', JSON.stringify(tripData.day3));
        }

        function loadFromLocalStorage() {
            const d1 = localStorage.getItem('yilan_schedule_day1');
            const d2 = localStorage.getItem('yilan_schedule_day2');
            const d3 = localStorage.getItem('yilan_schedule_day3');
            if (d1) tripData.day1 = JSON.parse(d1);
            if (d2) tripData.day2 = JSON.parse(d2);
            if (d3) tripData.day3 = JSON.parse(d3);
        }


        function renderAll() {
            const editButton = document.getElementById('edit-itinerary');
            editButton.disabled = !syncReady || syncConflict;
            editButton.setAttribute('aria-pressed', String(isEditing));
            editButton.innerHTML = isEditing
                ? '<i class="fa-solid fa-check mr-1.5" aria-hidden="true"></i> 完成'
                : '<i class="fa-solid fa-pen mr-1.5" aria-hidden="true"></i> 編輯';
            const resetButton = document.getElementById('reset-schedules');
            resetButton.disabled = !isEditing;
            resetButton.hidden = !isEditing;
            resetButton.classList.toggle('hidden', !isEditing);
            renderItinerary();
            applyFilterAndSearch();
            const totalCount = items.length;
            const countEl = document.getElementById('total-count');
            if (countEl) countEl.innerText = totalCount;
        }

        // 搜尋與篩選整合處理
        function searchItems() {
            applyFilterAndSearch();
        }

        function applyFilterAndSearch() {
            const searchInput = document.getElementById('search-input');
            const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

            let filtered = items.filter(item => {
                const matchesType = (currentFilter === 'all') || (item.type === currentFilter);
                const matchesKeyword = !keyword || 
                    item.name.toLowerCase().includes(keyword) || 
                    item.location.toLowerCase().includes(keyword) || 
                    item.tag.toLowerCase().includes(keyword) || 
                    item.desc.toLowerCase().includes(keyword);
                return matchesType && matchesKeyword;
            });

            renderItems(filtered);
        }

        // 切換日期分頁
        function switchDay(day) {
            currentDay = day;
            const btn1 = document.getElementById('tab-day1');
            const btn2 = document.getElementById('tab-day2');
            const btn3 = document.getElementById('tab-day3');
            const title = document.getElementById('current-day-title');

            if (!btn1 || !btn2 || !btn3) return;

            btn1.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-800";
            btn2.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-800";
            btn3.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-800";

            if (day === 'day1') {
                btn1.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition bg-[#0284c7] text-white shadow-sm";
                title.innerText = "12月12日 (星期五) 行程";
            } else if (day === 'day2') {
                btn2.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition bg-[#0284c7] text-white shadow-sm";
                title.innerText = "12/13 (星期六) 行程";
            } else {
                btn3.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition bg-[#0284c7] text-white shadow-sm";
                title.innerText = "12/14 (星期日) 行程";
            }
            renderItinerary();
        }

        function toggleItineraryEdit() {
            if (!syncReady || syncConflict) return;
            isEditing = !isEditing;
            renderAll();
        }

        function getSchedule(day) {
            const val = tripData[day];
            if (Array.isArray(val)) {
                return { ids: val, notes: {} };
            }
            return val || { ids: [], notes: {} };
        }

        function updateSchedule(day, newIds, newNotes) {
            if (!isEditing || !syncReady || syncConflict) return;
            tripData[day] = { ids: newIds, notes: newNotes };
            if (isCloudSynced) {
                saveCloudData();
            } else {
                saveToLocalStorage();
            }
            renderAll();
        }

        // 將項目加入指定日期
        function addToSchedule(itemId, day) {
            if (!isEditing || !syncReady || syncConflict) return;
            let dayObj = getSchedule(day);
            let ids = [...dayObj.ids];
            let notes = { ...dayObj.notes };
            if (!ids.includes(itemId)) {
                ids.push(itemId);
                updateSchedule(day, ids, notes);
            }
        }

        // 從行程中移除
        function removeFromSchedule(itemId, day) {
            if (!isEditing || !syncReady || syncConflict) return;
            let dayObj = getSchedule(day);
            let ids = dayObj.ids.filter(id => id !== itemId);
            let notes = { ...dayObj.notes };
            delete notes[itemId];
            updateSchedule(day, ids, notes);
        }

        // 更新項目備註
        function updateItemNote(itemId, day, noteText) {
            if (!isEditing || !syncReady || syncConflict) return;
            let dayObj = getSchedule(day);
            let ids = [...dayObj.ids];
            let notes = { ...dayObj.notes, [itemId]: noteText };
            tripData[day] = { ids, notes };
            saveCloudData();
        }

        // 行程上下移動排序
        function moveItem(index, direction, day) {
            if (!isEditing || !syncReady || syncConflict) return;
            let dayObj = getSchedule(day);
            let ids = [...dayObj.ids];
            let notes = { ...dayObj.notes };
            
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= ids.length) return;
            
            const temp = ids[index];
            ids[index] = ids[targetIndex];
            ids[targetIndex] = temp;
            
            updateSchedule(day, ids, notes);
        }

        // 重置所有行程
        function resetAllSchedules() {
            if (!isEditing || !syncReady || syncConflict) return;
            tripData.day1 = { ids: [], notes: {} };
            tripData.day2 = { ids: [], notes: {} };
            tripData.day3 = { ids: [], notes: {} };
            if (isCloudSynced) {
                saveCloudData();
            } else {
                saveToLocalStorage();
            }
            renderAll();
        }

        // 渲染左側行程表
        function renderItinerary() {
            const container = document.getElementById('itinerary-list');
            const dayObj = getSchedule(currentDay);
            const scheduleIds = dayObj.ids;
            const notes = dayObj.notes || {};

            if (!container) return;
            container.innerHTML = '';

            const countText = document.getElementById('current-day-count');
            if (countText) countText.innerText = `已排入 ${scheduleIds.length} 個站點`;

            if (scheduleIds.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-50 border border-dashed border-slate-200 rounded-2xl p-8 text-center text-slate-400">
                        <i class="fa-solid fa-calendar-plus text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm">此日尚無行程，請從右側點擊加入此日行程！</p>
                    </div>
                `;
                return;
            }

            scheduleIds.forEach((id, index) => {
                const item = items.find(i => i.id === id);
                if (!item) return;
                const isRestaurant = item.type === 'restaurant';
                const currentNote = notes[id] || '';

                const card = document.createElement('div');
                card.className = "bg-white/80 hover:bg-white border border-slate-200/80 rounded-xl p-4 transition flex flex-col gap-2.5 shadow-xs";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-start gap-3">
                            <div class="bg-[#0284c7] text-white font-bold text-sm w-7 h-7 rounded-lg flex items-center justify-center shrink-0 mt-0.5 shadow-xs">
                                ${index + 1}
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${isRestaurant ? 'bg-orange-50 text-orange-700 border border-orange-200' : 'bg-sky-50 text-sky-800'}">
                                        ${isRestaurant ? '美食' : '景點'}
                                    </span>
                                    <span class="text-xs text-slate-500 font-medium">${item.tag}</span>
                                </div>
                                <h4 class="text-base font-bold text-slate-800">${item.name}</h4>
                                ${item.highlight ? `<p class="text-xs text-rose-600 font-bold mt-1 bg-rose-50 px-2.5 py-1 rounded-md border border-rose-200 w-fit"><i class="fa-solid fa-clock mr-1"></i>${item.highlight}</p>` : ''}
                            </div>
                        </div>
                        <div class="${isEditing ? 'flex' : 'hidden'} items-center gap-1 shrink-0">
                            <div class="flex flex-col gap-0.5">
                                <button onclick="moveItem(${index}, -1, '${currentDay}')" ${index === 0 ? 'disabled class="text-slate-300 cursor-not-allowed text-sm p-1"' : 'class="text-slate-400 hover:text-[#0284c7] text-sm p-1 transition"'} title="往上移">
                                    <i class="fa-solid fa-chevron-up"></i>
                                </button>
                                <button onclick="moveItem(${index}, 1, '${currentDay}')" ${index === scheduleIds.length - 1 ? 'disabled class="text-slate-300 cursor-not-allowed text-sm p-1"' : 'class="text-slate-400 hover:text-[#0284c7] text-sm p-1 transition"'} title="往下移">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </button>
                            </div>
                            <button onclick="removeFromSchedule('${id}', '${currentDay}')" class="text-slate-400 hover:text-rose-500 p-1.5 transition text-sm" title="從此日移除">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <!-- 即時備註輸入框 -->
                    <div class="mt-1">
                        <input ${isEditing ? '' : 'readonly'} type="text" value="${currentNote.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;')}" oninput="updateItemNote('${id}', '${currentDay}', this.value)" placeholder="輸入自訂備註（例如：11:30 抵達、預約保留中）..." class="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#0284c7] text-slate-600">
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 渲染右側可用景點列表
        function renderItems(dataToRender) {
            const container = document.getElementById('items-container');
            if (!container) return;
            container.innerHTML = '';

            if (dataToRender.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center text-slate-400 shadow-xs border border-slate-200">
                        <i class="fa-solid fa-face-meh text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm">沒有找到符合條件的項目</p>
                    </div>
                `;
                return;
            }

            dataToRender.forEach(item => {
                const isRestaurant = item.type === 'restaurant';
                const inDay1 = getSchedule('day1').ids.includes(item.id);
                const inDay2 = getSchedule('day2').ids.includes(item.id);
                const inDay3 = getSchedule('day3').ids.includes(item.id);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-5 shadow-xs border border-slate-200 hover:border-[#0284c7] transition duration-200";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-4">
                        <div class="space-y-2">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-xs font-semibold px-3 py-1 rounded-full ${isRestaurant ? 'bg-orange-50 text-orange-700 border border-orange-200' : 'bg-sky-50 text-sky-700 border border-sky-200'}">
                                    ${isRestaurant ? '<i class="fa-solid fa-utensils mr-1"></i>餐廳美食' : '<i class="fa-solid fa-camera mr-1"></i>觀光景點'}
                                </span>
                                <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-medium"><i class="fa-solid fa-location-dot text-[#0284c7] mr-1"></i>${item.tag}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800">${item.name}</h3>
                            <p class="text-sm text-slate-500"><i class="fa-regular fa-map mr-1"></i>${item.location}</p>
                            
                            ${item.highlight ? `<div class="bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 w-fit"><i class="fa-solid fa-calendar-check text-rose-500"></i>${item.highlight}</div>` : ''}
                            
                            <div class="text-sm text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                                ${item.desc}
                            </div>
                        </div>

                        <div class="flex flex-col items-end gap-2 shrink-0">
                            <a href="${item.mapUrl}" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl font-medium transition flex items-center gap-1 border border-slate-200">
                                <i class="fa-solid fa-diamond-turn-right text-slate-500"></i> 地圖
                            </a>
                            
                            <!-- 三日加入行程按鈕 -->
                            <div class="flex flex-col gap-1.5 mt-1">
                                <button onclick="addToSchedule('${item.id}', 'day1')" ${(!isEditing || inDay1) ? 'disabled class="bg-slate-100 text-slate-400 cursor-default text-xs px-3 py-1.5 rounded-lg font-medium"' : 'class="bg-[#0284c7] hover:bg-[#0369a1] text-white text-xs px-3.5 py-1.5 rounded-lg transition font-medium shadow-xs"'}>
                                    ${inDay1 ? '<i class="fa-solid fa-check mr-1"></i>已在 12/12' : '+ 12/12'}
                                </button>
                                <button onclick="addToSchedule('${item.id}', 'day2')" ${(!isEditing || inDay2) ? 'disabled class="bg-slate-100 text-slate-400 cursor-default text-xs px-3 py-1.5 rounded-lg font-medium"' : 'class="bg-[#0284c7] hover:bg-[#0369a1] text-white text-xs px-3.5 py-1.5 rounded-lg transition font-medium shadow-xs"'}>
                                    ${inDay2 ? '<i class="fa-solid fa-check mr-1"></i>已在 12/13' : '+ 12/13'}
                                </button>
                                <button onclick="addToSchedule('${item.id}', 'day3')" ${(!isEditing || inDay3) ? 'disabled class="bg-slate-100 text-slate-400 cursor-default text-xs px-3 py-1.5 rounded-lg font-medium"' : 'class="bg-[#38bdf8] hover:bg-[#0284c7] text-white text-xs px-3.5 py-1.5 rounded-lg transition font-medium shadow-xs"'}>
                                    ${inDay3 ? '<i class="fa-solid fa-check mr-1"></i>已在 12/14' : '+ 12/14'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterItems(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-2 rounded-xl font-medium transition";
            });
            const activeBtn = document.getElementById(`filter-${type}`);
            if (activeBtn) {
                activeBtn.className = "filter-btn bg-[#0284c7] text-white text-xs px-3 py-2 rounded-xl font-medium transition shadow-sm";
            }
            applyFilterAndSearch();
        }

        // 綁定全域函式供 HTML onclick 使用
        window.toggleItineraryEdit = toggleItineraryEdit;
        window.switchDay = switchDay;
        window.searchItems = searchItems;
        window.filterItems = filterItems;
        window.addToSchedule = addToSchedule;
        window.removeFromSchedule = removeFromSchedule;
        window.updateItemNote = updateItemNote;
        window.moveItem = moveItem;
        window.resetAllSchedules = resetAllSchedules;

        // 頁面載入時初始化 Firebase
        window.onload = function() {
            initFirebase();
        };
    </script>
</body>
</html>
