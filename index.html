<!doctype html>
<html lang="zh-TW" data-cloud="false">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>魚你同行</title>
   <title>魚你同行｜線上旅遊行程規劃與景點地圖工具</title>
<meta name="description" content="「魚你同行」是一款輕量化線上旅遊規劃工具，支援自訂多日行程表、分類管理景點與美食清單、整合住宿資訊與一鍵地圖導航，並提供密碼保護與即時同步功能，輕鬆整理並分享專屬旅程。">
<meta name="keywords" content="旅遊行程規劃,線上行程表,景點美食清單,旅遊地圖導航,自由行規劃工具,魚你同行">
<meta property="og:title" content="魚你同行｜線上旅遊行程規劃與景點地圖工具">
<meta property="og:description" content="集中管理旅遊行程、景點美食、住宿地址與地圖導航，支援即時同步與編輯密碼鎖定，讓行前規劃與旅途查詢更直覺。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fish550212.github.io/travel/code_artifact.html">
    <link rel="icon" type="image/png" href="./頭像-01.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        body { margin: 0; background: #f8fafc; color: #1e293b; font-family: "Noto Sans TC", Inter, sans-serif; }
        header { background: #0a507b; color: #f8fafc; }
        .container { max-width: 80rem; margin-inline: auto; padding-inline: 1rem; }
        .brand { display: flex; align-items: center; gap: .75rem; min-height: 50px; font-weight: 700; }
        main { padding-block: 1.25rem 6rem; }
        .list-heading { display: flex; align-items: center; justify-content: space-between; min-height: 2.25rem; margin-block-end: .625rem; }
        h1 { margin: 0; font-size: 1.125rem; }
        .icon-button { display: grid; place-items: center; flex: 0 0 2.5rem; width: 2.5rem; height: 2.5rem; border: 0; border-radius: 8px; cursor: pointer; }
        .icon-button:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
        .icon-button:disabled { opacity: .5; cursor: default; }
        #edit-trip-list { background: transparent; color: #888888; }
        #edit-trip-list[aria-pressed="true"] { background: #0284c7; color: #fff; }
        .trips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: .75rem; padding: 0; margin: 0; list-style: none; }
        .trips > li { display: flex; align-items: center; gap: .5rem; min-width: 0; }
        .delete-trip { display: none; background: #fff1f2; color: #be123c; }
        .trips.is-editing .delete-trip { display: grid; }
        .trip { display: flex; align-items: center; gap: .75rem; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; color: inherit; text-decoration: none; }
        .trip { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .trip-icon, .trip-arrow { flex-shrink: 0; }
        .trip-label { display: grid; gap: .125rem; min-width: 0; }
        .trip-dates { color: #64748b; font-size: .8125rem; line-height: 1.4; }
        .trip:hover { border-color: #7dd3fc; background: #f0f9ff; }
        .trip:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
        .trip-icon { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 8px; background: #e0f2fe; color: #0369a1; }
        .trip-arrow { margin-inline-start: auto; color: #0369a1; font-size: .875rem; }
        .create-trip { position: fixed; inset-inline-end: max(1rem, env(safe-area-inset-right)); bottom: calc(1rem + env(safe-area-inset-bottom)); display: grid; place-items: center; width: 3.25rem; height: 3.25rem; border: 0; border-radius: 8px; background: #0284c7; color: #fff; font: 600 1.75rem/1 Inter, sans-serif; cursor: pointer; box-shadow: 0 4px 12px rgb(10 80 123 / 25%); }
        .create-trip:hover { background: #0369a1; }
        .create-trip:focus-visible { outline: 2px solid #0369a1; outline-offset: 3px; }
        .create-trip:disabled { opacity: .65; cursor: wait; }
        .trip-sync { position: fixed; inset-inline-start: 50%; bottom: calc(1rem + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem; min-height: 3.25rem; padding: .4rem .75rem; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; color: #475569; font-size: .75rem; line-height: 1.25; white-space: nowrap; }
        .trip-sync i { color: #0369a1; font-size: .875rem; }
        .trip-sync a, .trip-sync button { color: #0369a1; font: inherit; text-decoration: underline; }
        .trip-sync button { padding: 0; border: 0; background: transparent; cursor: pointer; }
        #trip-list-status { color: #9f1239; font-size: .875rem; }
        .remove-dialog { width: min(28rem, calc(100% - 2rem)); padding: 1.25rem; border: 0; border-radius: 12px; color: #1e293b; }
        .remove-dialog::backdrop { background: rgb(15 23 42 / 50%); }
        .remove-dialog h2 { margin: 0; font-size: 1.125rem; }
        .remove-dialog p { overflow-wrap: anywhere; }
        .remove-dialog-actions { display: flex; justify-content: flex-end; gap: .5rem; }
        .remove-dialog-actions button { padding: .5rem .875rem; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
        .confirm-removal { background: #be123c; color: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="container brand"><img src="./頭像-01.png" alt="" width="28" height="28">魚你同行</div>
    </header>
    <main class="container">
        <div class="list-heading">
            <h1>旅行列表</h1>
            <button id="edit-trip-list" class="icon-button" type="button" aria-label="編輯旅行列表" aria-pressed="false" title="編輯旅行列表"><i class="fa-solid fa-gear" aria-hidden="true"></i></button>
        </div>
        <ul id="trips" class="trips">
            <li><a class="trip" href="./code_artifact.html">
                <i class="trip-icon fa-solid fa-suitcase-rolling" aria-hidden="true"></i>
                <span class="trip-label"><strong>宜蘭旅行</strong><small class="trip-dates">2026/12/12 – 12/14</small></span>
                <i class="trip-arrow fa-solid fa-chevron-right" aria-hidden="true"></i>
            </a><button class="icon-button delete-trip" type="button"><i class="fa-solid fa-trash-can" aria-hidden="true"></i></button></li>
        </ul>
        <p id="trip-list-status" role="status"></p>
    </main>
    <div class="trip-sync">
        <i id="trip-sync-icon" class="fa-solid fa-cloud" aria-hidden="true"></i>
        <span id="trip-sync-text" role="status">同步中</span>
        <button id="retry-trip-sync" type="button" hidden>重新同步</button>
        <a id="live-trip-site" href="https://yilan-trip-fish-20261116.codexllllllll.chatgpt.site/" hidden>開啟正式版</a>
    </div>
    <button id="create-trip" class="create-trip" type="button" aria-label="新增旅程" title="新增旅程">+</button>
    <dialog id="remove-trip-dialog" class="remove-dialog" aria-labelledby="remove-trip-title" aria-describedby="remove-trip-description">
        <form method="dialog">
            <h2 id="remove-trip-title">刪除旅程</h2>
            <p id="remove-trip-description"></p>
            <div class="remove-dialog-actions">
                <button value="cancel" autofocus>取消</button>
                <button class="confirm-removal" value="delete">刪除</button>
            </div>
        </form>
    </dialog>
    <script>
        const list = document.getElementById('trips');
        const card = list.firstElementChild;
        const create = document.getElementById('create-trip');
        const edit = document.getElementById('edit-trip-list');
        const status = document.getElementById('trip-list-status');
        const syncIcon = document.getElementById('trip-sync-icon');
        const syncText = document.getElementById('trip-sync-text');
        const retrySync = document.getElementById('retry-trip-sync');
        const liveSite = document.getElementById('live-trip-site');
        const removeDialog = document.getElementById('remove-trip-dialog');
        const removeDescription = document.getElementById('remove-trip-description');
        const cloudHosted = document.documentElement.dataset.cloud === 'true';
        const githubHosted = window.location.hostname === 'fish550212.github.io';
        const sheetsApi = 'https://script.google.com/macros/s/AKfycbw0XuCer50X1oM-joR2A5bxCOjaCoA_HV8B2l-r8iNUdzx1w0efI6PkdhvZmUxPwhZe/exec';
        let tripListRequest;
        let tripsLoaded = false;
        let pendingRemoval;

        function showSync(icon, label) {
            syncIcon.className = 'fa-solid ' + icon;
            syncText.textContent = label;
        }

        function tripUrl(id) {
            return './code_artifact.html' + (id ? '?trip=' + encodeURIComponent(id) : '');
        }

        async function fetchTripApi(path, options = {}) {
            if (!githubHosted) return fetch('./' + path, options);
            const {method = 'GET'} = options;
            const id = new URL(path, window.location.href).searchParams.get('trip');
            const action = {GET:'travel-list',POST:'travel-create',DELETE:'travel-delete'}[method];
            const response = await fetch(sheetsApi, {
                method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'},
                body:JSON.stringify({action,id})
            });
            if (!response.ok) return response;
            const data = await response.json();
            const status = data.error ? ({not_found:404,locked:423}[data.error] ?? 503) : 200;
            return new Response(JSON.stringify(data), {status});
        }

        function formatTripDates(departure, returning) {
            if (!departure || !returning) return '';
            const start = departure.replaceAll('-', '/');
            if (departure === returning) return start;
            const end = departure.slice(0, 4) === returning.slice(0, 4) ? returning.slice(5) : returning;
            return start + ' – ' + end.replaceAll('-', '/');
        }

        edit.addEventListener('click', async () => {
            if (!cloudHosted && !githubHosted) {
                window.location.href = liveSite.href;
                return;
            }
            edit.disabled = true;
            const ready = tripsLoaded || await loadTrips();
            edit.disabled = false;
            if (!ready) {
                status.textContent = '暫時無法載入旅行列表，請點「重新同步」再試。';
                return;
            }
            const editing = list.classList.toggle('is-editing');
            edit.setAttribute('aria-pressed', String(editing));
            edit.title = editing ? '完成編輯' : '編輯旅行列表';
            edit.setAttribute('aria-label', edit.title);
            edit.firstElementChild.className = editing ? 'fa-solid fa-check' : 'fa-solid fa-gear';
        });

        function confirmRemoval(trip, entry, button) {
            pendingRemoval = {trip, entry, button};
            removeDescription.textContent = '確定要從旅行列表刪除「' + trip.title + '」嗎？';
            removeDialog.returnValue = '';
            removeDialog.showModal();
        }

        removeDialog.addEventListener('close', () => {
            const removal = pendingRemoval;
            pendingRemoval = undefined;
            if (removeDialog.returnValue === 'delete' && removal) {
                void removeTrip(removal.trip, removal.entry, removal.button);
            }
        });

        async function removeTrip(trip, entry, button) {
            button.disabled = true;
            status.textContent = '';
            try {
                const endpoint = 'api/itinerary' + (trip.id ? '?trip=' + encodeURIComponent(trip.id) : '');
                const response = await fetchTripApi(endpoint, {method: 'DELETE'});
                if (!githubHosted && response.status === 403) {
                    window.location.href = '/signin-with-chatgpt?return_to=%2F';
                    return;
                }
                if (response.status === 423) {
                    status.textContent = '這個旅程已上鎖。請先在旅程頁解除密碼鎖定，再刪除。';
                    return;
                }
                if (!response.ok) throw new Error('Could not remove trip');
                entry.remove();
                edit.focus();
                if (!list.firstElementChild) status.textContent = '目前沒有旅行。';
            } catch {
                status.textContent = '目前無法刪除旅程，請稍後再試。';
            } finally {
                button.disabled = false;
            }
        }

        function loadTrips() {
            tripListRequest ??= fetchTrips().finally(() => { tripListRequest = undefined; });
            return tripListRequest;
        }

        function refreshLocalTripCard() {
            let draft;
            try { draft = JSON.parse(sessionStorage.getItem('yilan_trip_preview')); } catch { /* Storage can be unavailable for local files. */ }
            const preview = new URLSearchParams(window.location.hash.slice(1));
            const fromFile = window.location.protocol === 'file:';
            const title = (fromFile && preview.get('title')) || draft?.title;
            const departure = (fromFile && preview.get('departureDate')) || draft?.dateRange?.departureDate || draft?.dates?.day1;
            const returning = (fromFile && preview.get('returnDate')) || draft?.dateRange?.returnDate || draft?.dates?.day3;
            if (title) card.querySelector('strong').textContent = title;
            if (departure && returning) card.querySelector('.trip-dates').textContent = formatTripDates(departure, returning);
        }

        async function fetchTrips() {
            if (!cloudHosted && !githubHosted) {
                refreshLocalTripCard();
                showSync('fa-desktop', '本機預覽');
                liveSite.hidden = false;
                return false;
            }
            retrySync.hidden = true;
            showSync('fa-cloud', '同步中');
            try {
                const response = await fetchTripApi('api/trips', {cache: 'no-store'});
                if (!response.ok) throw new Error('Could not load trips');
                const {trips} = await response.json();
                list.replaceChildren(...trips.map(trip => {
                    const entry = card.cloneNode(true);
                    entry.querySelector('a').href = tripUrl(trip.id);
                    entry.querySelector('strong').textContent = trip.title;
                    const dates = entry.querySelector('.trip-dates');
                    dates.textContent = formatTripDates(trip.departureDate, trip.returnDate);
                    dates.hidden = !dates.textContent;
                    const button = entry.querySelector('.delete-trip');
                    button.setAttribute('aria-label', '刪除「' + trip.title + '」');
                    button.title = '刪除旅程';
                    button.addEventListener('click', () => confirmRemoval(trip, entry, button));
                    return entry;
                }));
                tripsLoaded = true;
                status.textContent = trips.length ? '' : '目前沒有旅行。';
                showSync('fa-circle-check', '雲端已同步');
                return true;
            } catch {
                showSync('fa-circle-exclamation', '暫時無法同步');
                retrySync.hidden = false;
                return false;
            }
        }

        create.addEventListener('click', async () => {
            if (!cloudHosted && !githubHosted) {
                window.location.href = liveSite.href;
                return;
            }
            create.disabled = true;
            status.textContent = '';
            try {
                const response = await fetchTripApi('api/trips', {method: 'POST'});
                if (!githubHosted && response.status === 403) {
                    window.location.href = '/signin-with-chatgpt?return_to=%2F';
                    return;
                }
                if (!response.ok) throw new Error('Could not create trip');
                const {id} = await response.json();
                window.location.href = tripUrl(id);
            } catch {
                status.textContent = '目前無法新增旅程，請稍後再試。';
            } finally {
                create.disabled = false;
            }
        });
        retrySync.addEventListener('click', loadTrips);
        window.addEventListener('pageshow', event => {
            if (event.persisted) void loadTrips();
        });
        void loadTrips();
    </script>
</body>
</html>
