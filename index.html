<!doctype html>
<html lang="zh-TW" data-cloud="false">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>魚你同行</title>
   <title>魚你同行｜線上旅遊行程規劃與景點地圖工具</title>
<meta name="description" content="「魚你同行」是一款輕量化線上旅遊規劃工具，支援自訂多日行程表、分類管理景點與美食清單、整合住宿資訊與一鍵地圖導航，並提供密碼保護與即時同步功能，輕鬆整理並分享專屬旅程。">
<meta name="keywords" content="旅遊行程規劃,線上行程表,景點美食清單,旅遊地圖導航,自由行規劃工具,魚你同行">
<meta property="og:title" content="魚你同行｜線上旅遊行程規劃與景點地圖工具">
<meta property="og:description" content="集中管理旅遊行程、景點美食、住宿地址與地圖導航，支援即時同步與編輯密碼鎖定，讓行前規劃與旅途查詢更直覺。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fish550212.github.io/travel/code_artifact.html">
    <link rel="icon" type="image/png" href="./images/頭像-01.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/controls.css">
</head>
<body>
    <header>
        <div class="container brand"><img src="./images/頭像-01.png" alt="" width="28" height="28">魚你同行</div>
    </header>
    <main class="container">
        <div class="list-heading">
            <h1>旅行列表</h1>
            <button id="edit-trip-list" class="ui-control ui-large ui-square ui-icon-16 icon-button" type="button" aria-label="編輯旅行列表" aria-pressed="false" title="編輯旅行列表"><i class="fa-solid fa-gear" aria-hidden="true"></i></button>
        </div>
        <ul id="trips" class="trips">
            <li><a class="trip" href="./code_artifact.html">
                <i class="trip-icon fa-solid fa-suitcase-rolling" aria-hidden="true"></i>
                <span class="trip-label"><strong>宜蘭旅行</strong><small class="trip-dates">2026/12/12 – 12/14</small></span>
                <i class="trip-arrow fa-solid fa-chevron-right" aria-hidden="true"></i>
            </a>
                <div class="trip-actions" inert>
                    <button class="ui-control ui-large ui-square ui-action-edit ui-icon-16 icon-button copy-trip" type="button"><i class="fa-solid fa-clone" aria-hidden="true"></i></button>
                    <button class="ui-control ui-large ui-square ui-action-delete icon-button delete-trip" type="button"><i class="fa-solid fa-trash-can" aria-hidden="true"></i></button>
                </div>
            </li>
        </ul>
        <p id="trip-list-status" role="status"></p>
    </main>
    <div class="trip-sync">
        <i id="trip-sync-icon" class="fa-solid fa-cloud" aria-hidden="true"></i>
        <span id="trip-sync-text" role="status">同步中</span>
        <button id="retry-trip-sync" class="ui-control ui-small" type="button" hidden>重新同步</button>
        <a id="live-trip-site" href="https://fish550212.github.io/travel/" hidden>開啟正式版</a>
    </div>
    <button id="create-trip" class="ui-control ui-large ui-square create-trip" type="button" aria-label="新增旅程" title="新增旅程"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
    <dialog id="remove-trip-dialog" class="remove-dialog" aria-labelledby="remove-trip-title" aria-describedby="remove-trip-description">
        <form method="dialog">
            <h2 id="remove-trip-title" tabindex="-1" autofocus>刪除旅程</h2>
            <p id="remove-trip-description"></p>
            <div class="dialog-actions remove-dialog-actions">
                <button class="ui-control ui-large" value="cancel">取消</button>
                <button class="ui-control ui-large confirm-removal" value="delete">刪除</button>
            </div>
        </form>
    </dialog>
    <script src="./js/index.js"></script>
</body>
</html>
